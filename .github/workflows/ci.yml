name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

# Where each check runs. Free hosted runners (ubuntu-latest, macos-26) run everything their Xcode 26 can: on every pull
# request and push. The billed xcode-27 runner (capped at $15 a month for this repository; usage stops at the cap) runs
# only what needs Xcode 27 or an iOS 27 OS, on pushes to main and on published releases. The X-ray lanes also run on a
# pull request that touches the X-ray, Ouro Feel, their fixtures or this workflow (the `paths` job), so a break is
# caught before merge rather than on main. Drop it once macos-26 or macos-latest ships Xcode 27: move those steps onto that image and delete the
# `if:` gates below. No self-hosted runners.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths:
    name: What this change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      xray: ${{ steps.diff.outputs.xray }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Does it touch the X-ray, Ouro Feel, their fixtures or the workflow?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then echo "xray=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE...$HEAD" > changed.txt
          if grep -E '^(Sources/(OuroAX|OuroAXTesting|OuroAXTestingProbe|OuroAXSkillsLint|ouro-ax-xray|OuroFeel|OuroFeelCore)/|Templates/XrayProbe/|Examples/(OuroAXXrayFixture|OuroFeelFixture)/|scripts/(xray-probe|ouro-feel-cold|select-xcode)\.sh$|\.github/workflows/|Package\.(swift|resolved)$)' changed.txt; then
            echo "xray=true" >> "$GITHUB_OUTPUT"
          else
            echo "xray=false" >> "$GITHUB_OUTPUT"
          fi

  provenance:
    name: Core provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Vendored files match ouro-ui-core's release, byte for byte
        run: python3 -I scripts/check-provenance.py
      - name: One changed byte fails the check
        run: |
          set -u
          printf ' ' >> Sources/OuroHX/Tokens/OuroTokens.swift
          python3 -I scripts/check-provenance.py --offline && status=0 || status=$?
          git checkout -- Sources/OuroHX/Tokens/OuroTokens.swift
          test "$status" -eq 3
          printf ' ' >> Sources/OuroAXTesting/Resources/apple.claims.json
          python3 -I scripts/check-provenance.py --offline && status=0 || status=$?
          git checkout -- Sources/OuroAXTesting/Resources/apple.claims.json
          test "$status" -eq 3
          printf ' ' >> Sources/OuroHXTesting/Resources/components.claims.json
          python3 -I scripts/check-provenance.py --offline && status=0 || status=$?
          git checkout -- Sources/OuroHXTesting/Resources/components.claims.json
          test "$status" -eq 3

  xcode-27:
    name: Build and test with Xcode 27 (main and releases only)
    # xcode-27 is GitHub's billed hosted image with Xcode 27 (image xcode-27-arm64). It compiles what the free image
    # fences out: the iOS 27.1 hinge APIs (`#if canImport(SwiftUICore, _version: 8.0.85)`) and AppIntentsTesting.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 27.2 or later
        run: sh scripts/select-xcode.sh 27.2
      # OURO_REQUIRE_HINGE turns a fenced-out hinge into a build error, so this SDK proves the hinge code compiles.
      - name: swift build
        run: swift build --build-tests -Xswiftc -DOURO_REQUIRE_HINGE
      - name: swift test
        run: swift test -Xswiftc -DOURO_REQUIRE_HINGE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-actual-xcode-27
          path: Tests/OuroHXTests/__Snapshots__/**/*.actual.png
          if-no-files-found: ignore
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS='$(inherited) -DOURO_REQUIRE_HINGE' 2>&1 | tail -40

  oldest-xcode-27:
    name: Build with Xcode ${{ matrix.xcode }}'s SDKs (main and releases only)
    # Xcode 27.0 and 27.1 have Swift 6.4 with older SDKs (macOS 27.0; iOS 27.0 and 27.1). A fence on the compiler let
    # 27.2-SDK code into these builds (ouro-ui-apple#6), so each one builds here, and prints its SwiftUICore versions
    # so the hinge fence's threshold can be checked against them.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        xcode: ["27.0", "27.1"]
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sh scripts/select-xcode.sh --exact ${{ matrix.xcode }}
      - name: SwiftUICore versions in this Xcode's SDKs
        run: |
          for sdk in macosx iphoneos iphonesimulator; do
            path="$(xcrun --sdk "$sdk" --show-sdk-path)"
            file="$(ls "$path"/System/Library/Frameworks/SwiftUICore.framework/Modules/SwiftUICore.swiftmodule/*.swiftinterface | grep -v macabi | head -1)"
            echo "$sdk $(xcrun --sdk "$sdk" --show-sdk-version): SwiftUICore $(grep -o 'user-module-version [0-9.]*' "$file" | head -1 | cut -d' ' -f2)," \
              "hinge APIs: $(grep -q 'func onHingeChange' "$file" && echo declared || echo absent)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: swift build (macOS SDK)
        run: swift build --build-tests
      # The iOS 27.1 SDK declares the hinge APIs, so with Xcode 27.1 the iOS build must compile them.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          require=""
          [ '${{ matrix.xcode }}' = '27.1' ] && require='-DOURO_REQUIRE_HINGE'
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS="\$(inherited) $require" 2>&1 | tail -40

  swift:
    name: Build, test, DocC and gallery (free macos-26, Xcode 26)
    # GitHub's free standard image. Its Xcode 26 lacks the iOS 27 SDK, so the hinge APIs, AppIntentsTesting and the
    # Siri AI parts compile out behind compiler and canImport checks; the xcode-27 job covers them on main.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift build
        run: swift build --build-tests
      - name: swift test
        run: swift test --skip ComponentSnapshotTests
      # A missing or changed component snapshot fails the job (in the last step, so the builds and DocC below still
      # run); its render goes up as an artifact to record from.
      - name: Component snapshots (references in Tests/OuroHXTests/__Snapshots__/macOS-<major>)
        id: snapshots
        continue-on-error: true
        run: OURO_SNAPSHOT_RECORD=never swift test --filter ComponentSnapshotTests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-actual-macos-26
          path: Tests/OuroHXTests/__Snapshots__/**/*.actual.png
          if-no-files-found: ignore
      - name: The skills linter, as an agent runs it
        run: |
          set -u
          swift run ouro-ax-skills lint Tests/OuroAXSkillsLintTests/Fixtures/Good/Skills.skillsbundle --json
          swift run ouro-ax-skills lint Tests/OuroAXSkillsLintTests/Fixtures/Bad/Skills.skillsbundle --json && status=0 || status=$?
          test "$status" -eq 3
      - name: Ouro Reins, as an agent runs it (ls, do, a refusal, the exit codes)
        run: |
          set -u
          swift build --product ouro-reins-sample
          bin="$(swift build --show-bin-path)/ouro-reins-sample"
          "$bin" ls 'do openItem {"id":"flour"}' 'do toggleStocked' 'do goBack' > .build/reins-ok.ndjson
          printf 'ls\ndo nope\n{"id":3,"op":"do","action":"openItem","input":{"id":7}}\n' | "$bin" > .build/reins-refused.ndjson && status=0 || status=$?
          test "$status" -eq 2
          python3 -I - .build/reins-ok.ndjson .build/reins-refused.ndjson <<'PY'
          import json, sys
          ok = [json.loads(l) for l in open(sys.argv[1])]
          assert [r["ok"] for r in ok] == [True] * 4, ok
          assert [r["screen"]["focus"] for r in ok] == ["list", "item", "item", "list"], ok
          assert ok[2]["screen"]["state"]["stocked"] is False, ok[2]
          bad = [json.loads(l) for l in open(sys.argv[2])]
          assert bad[1]["error"]["code"] == "action-unavailable" and "openItem" in bad[1]["error"]["fix"], bad[1]
          assert bad[2]["id"] == 3 and bad[2]["error"]["code"] == "input-invalid", bad[2]
          print("reins: ls/do round trip and refusals as documented")
          PY
      - name: Ouro Reins' debug socket is compiled out of release
        run: sh scripts/check-reins-release.sh
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      - name: DocC
        run: sh scripts/docc.sh .build/docc
      - name: Build the gallery app
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroHXGallery && xcodegen generate)
          xcodebuild build -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/gallery CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      # DocC file names hold colons, which upload-artifact refuses, so the archives go up as one tarball.
      - name: Pack DocC
        run: tar -czf .build/docc.tgz -C .build docc
      - uses: actions/upload-artifact@v4
        with:
          name: docc
          path: .build/docc.tgz
      - name: Component snapshots matched
        if: steps.snapshots.outcome == 'failure'
        run: |
          echo "::error::A component snapshot is missing or changed. Record it from the snapshots-actual-macos-26 artifact into Tests/OuroHXTests/__Snapshots__/macOS-26."
          exit 1

  gallery-ui:
    name: Gallery UI tests, the component claims (free macos-26, Xcode 26)
    # performAccessibilityAudit on every component page at the default and the largest text size, in light and dark,
    # plus 44-point targets, VoiceOver names, close controls and the waiting action toast.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: A simulator for this job
        run: |
          set -eu
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroHXGallery && xcodegen generate)
          runtime="$(xcrun simctl list runtimes -j | python3 -I -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(sorted(r,key=lambda x:[int(p) for p in x["version"].split(".")])[-1]["identifier"])')"
          for device in "iPhone 17 Pro" "iPhone 16 Pro" "iPhone 16"; do
            udid="$(xcrun simctl create ouro-hx-ui "$device" "$runtime" 2>/dev/null)" && break
          done
          echo "Using $device on $runtime: $udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          # Booted and settled before xcodebuild starts, as the X-ray probe does: a cold boot under the first test was
          # where the runner lost testmanagerd (main, run 42166414006).
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b >/dev/null
      - name: Gallery UI tests
        run: |
          set -u
          mkdir -p .build
          gallery() {
            xcodebuild test -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery \
              -destination "id=$UDID" -derivedDataPath .build/gallery -resultBundlePath ".build/$1.xcresult" \
              CODE_SIGNING_ALLOWED=NO > ".build/$1.log" 2>&1
          }
          # A runner that loses testmanagerd or never bootstraps ran nothing wrong in the app: that is the machine, so it
          # gets one more run on a rebooted simulator, reported as an infrastructure retry. Any other failure fails.
          infra() {
            { cat ".build/$1.log"; xcrun xcresulttool get test-results summary --path ".build/$1.xcresult" 2>/dev/null; } |
              grep -m1 -oE "Lost connection to testmanagerd|never finished bootstrapping|Test runner exited before starting test execution|Failed to establish communication with the test runner"
          }
          status=0; gallery gallery-ui || status=$?
          grep -E "error|failed|passed|Executed|TEST" .build/gallery-ui.log | tail -80
          if [ "$status" -ne 0 ] && cause="$(infra gallery-ui)"; then
            echo "::warning title=Infrastructure retry::Gallery UI tests: \"$cause\". Rebooting the simulator and running them once more; the first attempt's result bundle is kept as gallery-ui-attempt-1."
            # A runner that never bootstrapped may have left no bundle; one that did must move it, or xcodebuild
            # refuses to write the next.
            if [ -e .build/gallery-ui.xcresult ]; then mv .build/gallery-ui.xcresult .build/gallery-ui-attempt-1.xcresult; fi
            mv .build/gallery-ui.log .build/gallery-ui-attempt-1.log
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b >/dev/null
            status=0; gallery gallery-ui || status=$?
            grep -E "error|failed|passed|Executed|TEST" .build/gallery-ui.log | tail -80
          fi
          exit "$status"
      - if: always()
        name: Pack the result bundle
        run: |
          bundles="$(cd .build && ls -d gallery-ui*.xcresult gallery-ui*.log 2>/dev/null || true)"
          test -n "$bundles" && tar -czf .build/gallery-ui.tgz -C .build $bundles || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-ui-xcresult
          path: .build/gallery-ui.tgz
          if-no-files-found: ignore

  xray:
    name: X-ray the fixture app (${{ matrix.name }})
    # The behaviour stage needs an Xcode whose AppIntentsTesting matches the OS it runs on: Xcode 27.2's needs a 27.2
    # OS, and this image has macOS 27.0.1 with iOS 27.0 and 27.1 simulators. So each lane pins an older Xcode to a
    # matching OS. See docs/decisions/2026-11-03-ax-xray.md.
    needs: paths
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.paths.outputs.xray == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "iOS 27.1 simulator, Xcode 27.1", xcode: "27.1", platform: ios, runtime: "27.1", device: "iPhone Duo", destination: "generic/platform=iOS Simulator", expect: full }
          - { name: "iOS 27.0 simulator, Xcode 27.0", xcode: "27.0", platform: ios, runtime: "27.0", device: "iPhone 17 Pro", destination: "generic/platform=iOS Simulator", expect: full }
          - { name: "macOS 27.0.1, Xcode 27.1", xcode: "27.1", platform: macos, runtime: "", device: "", destination: "platform=macOS", expect: refused }
          # macOS: AppIntentsTesting refuses a probe that is not signed by the app's team (AppIntentsServicesSecurityErrorDomain
          # 800). CI signs ad hoc, so this lane proves the refusal is reported as a skip with the fix, not as the app failing.
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode ${{ matrix.xcode }} for this job only
        run: |
          set -eu
          for app in /Applications/Xcode_*.app; do
            v="$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || true)"
            if [ "$v" = "${{ matrix.xcode }}" ] || [ "$v" = "${{ matrix.xcode }}.0" ]; then echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"; echo "Using $app ($v)"; exit 0; fi
          done
          ls -d /Applications/Xcode_*.app; exit 1
      - name: Tools
        run: |
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          swift build -c release --product ouro-ax-xray
      - name: Build the fixture app with the same Xcode
        run: |
          set -o pipefail
          (cd Examples/OuroAXXrayFixture && xcodegen generate)
          xcodebuild build -project Examples/OuroAXXrayFixture/OuroAXXrayFixture.xcodeproj -scheme OuroAXXrayFixture \
            -destination '${{ matrix.destination }}' -derivedDataPath .build/fixture CODE_SIGN_IDENTITY=- 2>&1 | tail -20
          find .build/fixture/Build/Products -maxdepth 2 -name XrayFixture.app
      - name: X-ray it, metadata and behaviour
        run: |
          set -eu
          app="$(find .build/fixture/Build/Products -maxdepth 2 -name XrayFixture.app | head -1)"
          sh scripts/xray-probe.sh --app "$app" --out .build/xray --platform ${{ matrix.platform }} \
            --runtime "${{ matrix.runtime }}" --device-type "${{ matrix.device }}" --commit "$GITHUB_SHA" --disposable
      - name: The probe saw the fixture's notes and its refusals
        run: |
          python3 -I - .build/xray/report.json ${{ matrix.expect }} <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          if sys.argv[2] == "refused":
              n = {(x["claim"], x["surface"]): (x["verdict"], x["note"]) for x in r["results"]}
              for k in [("entity.ids-resolve", "entity NoteEntity"), ("entity.indexed", "entity NoteEntity")]:
                  print(k, n[k])
                  assert n[k][0] == "skip" and n[k][1].startswith("AppIntentsTesting refused the probe"), k
              sys.exit(0)
          v = {(x["claim"], x["surface"]): x["verdict"] for x in r["results"]}
          print(json.dumps({k[0] + " " + k[1]: x for k, x in v.items() if k[0] in ("entity.ids-resolve", "entity.indexed", "entity.transfer-round-trip", "annotation.onscreen", "intent.error-names-fix")}, indent=1))
          assert v[("entity.ids-resolve", "entity NoteEntity")] == "pass", "ids-resolve"
          n = {(x["claim"], x["surface"]): x["note"] for x in r["results"]}
          assert v[("entity.indexed", "entity NoteEntity")] == "pass", "indexed"
          assert v[("entity.transfer-round-trip", "entity NoteEntity")] == "pass", "round trip"
          refusal = n[("intent.error-names-fix", "intent OpenNoteIntent")]
          assert not refusal.startswith("the probe could not reach"), "the refusals reached the app: " + refusal
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-fixture-${{ matrix.platform }}-${{ matrix.xcode }}
          path: .build/xray

  siri-ai-sdk:
    name: Siri AI parts (Xcode 27.3 beta, compile only)
    # The tool-intent and SiriEvaluations code compiles only against the 27.3 beta SDK. When the image carries an
    # Xcode 27.3 or later, this lane builds with OURO_SIRI_AI_SDK set; until then it says so and passes.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Find Xcode 27.3 or later
        id: find
        run: |
          set -eu
          if sh scripts/select-xcode.sh 27.3; then echo "found=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::No Xcode 27.3 or later on the xcode-27 image yet; the Siri AI parts were not compiled here."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build with the Siri AI parts on
        if: steps.find.outputs.found == 'true'
        run: |
          swift build --build-tests -Xswiftc -DOURO_SIRI_AI_SDK
          set -o pipefail
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode-beta CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -DOURO_SIRI_AI_SDK' 2>&1 | tail -40

  feel-fixture:
    name: Ouro Feel catches every genre's bug (free macos-26, Xcode 26)
    # Examples/OuroFeelFixture has one page per genre of jank with a known bug behind `-bug 1`; FeelCatchesTests proves
    # each check fails on the bug and passes without it. Reports go up as an artifact.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: A fresh simulator for this job
        run: |
          set -eu
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroFeelFixture && xcodegen generate)
          runtime="$(xcrun simctl list runtimes -j | python3 -I -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(sorted(r,key=lambda x:[int(p) for p in x["version"].split(".")])[-1]["identifier"])')"
          for device in "iPhone 17 Pro" "iPhone 16 Pro" "iPhone 16"; do
            udid="$(xcrun simctl create ouro-feel-ci "$device" "$runtime" 2>/dev/null)" && break
          done
          echo "Using $device on $runtime: $udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          # Boot it and wait until it has finished booting: left to xcodebuild, the first test's setUp can reach a
          # simulator whose accessibility is not up yet ("Failed to get list of active applications", kAXError -25218).
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b >/dev/null
      - name: Fixture UI tests (a fresh simulator; only the first test starts cold, so reports say "not labelled")
        run: |
          set -o pipefail
          TEST_RUNNER_OURO_FEEL_REPORT_DIR="$PWD/.build/feel-reports" \
          xcodebuild test -project Examples/OuroFeelFixture/OuroFeelFixture.xcodeproj -scheme OuroFeelFixture \
            -destination "id=$UDID" -derivedDataPath .build/feel-fixture -resultBundlePath .build/feel-fixture.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "\[ouro-feel\]|error|failed|passed|Executed|TEST" | tail -200
      - if: always()
        name: Pack the reports and result bundle
        run: |
          mkdir -p .build/feel-reports
          test -d .build/feel-fixture.xcresult && tar -czf .build/feel-reports/feel-fixture-xcresult.tgz -C .build feel-fixture.xcresult || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ouro-feel-fixture-reports
          path: .build/feel-reports
          if-no-files-found: ignore
