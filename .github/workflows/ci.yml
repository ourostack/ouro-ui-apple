name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      break_shard:
        description: "Treat these shards' runners as broken, to prove the requeue (#74), space-separated: gallery-<shard>-<iPhone|iPad>, feel-<shard>"
        required: false
        default: ""
      slow_shard:
        description: "Treat these Ouro Feel shards' runners as too slow, to prove the slow-runner requeue (#199), space-separated: feel-<shard>"
        required: false
        default: ""

# Where each check runs. Free hosted runners (ubuntu-latest, macos-26) run everything their Xcode 26 can: the Linux jobs on
# every pull request and push, the macOS jobs on main, releases and dispatch, never on a pull request. The billed xcode-27 runner (capped at $15 a month for this repository; usage stops at the cap) runs
# only what needs Xcode 27 or an iOS 27 OS, on pushes to main and on published releases. The X-ray lanes also run on a
# pull request that touches the X-ray, Ouro Feel, their fixtures or this workflow (the `paths` job), so a break is
# caught before merge rather than on main. The gallery's fold tests on an iPhone Duo (gallery-duo) also run on the
# billed runner, on main and releases only, never on pull requests. The same job runs the simulator jobs (gallery, Feel fixture) on a pull
# request only when it changes what they link; main and releases run them always, and the gallery's report-only
# hitch probe runs only there. A red main is fixed by whoever merged the change that turned it red (AGENTS.md).
# Drop the xcode-27 lanes once macos-26 or macos-latest ships Xcode 27: move those steps onto that image and delete the
# `if:` gates below. No self-hosted runners.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths:
    name: What this change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      xray: ${{ steps.diff.outputs.xray }}
      gallery: ${{ steps.diff.outputs.gallery }}
      feel: ${{ steps.diff.outputs.feel }}
      readme: ${{ steps.diff.outputs.readme }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Does it touch the X-ray, Ouro Feel, their fixtures or the workflow?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Pushes and releases run every simulator job; these outputs only narrow pull requests.
          if [ "$EVENT" != pull_request ]; then printf 'xray=false\ngallery=true\nfeel=true\nreadme=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE...$HEAD" > changed.txt
          shared='|\.github/workflows/|scripts/(ci-simulator\.py|ui-shards\.py|ci-wait-for-build\.sh|ci-ui-infra\.sh)$|Package\.(swift|resolved)$'
          # The gallery and Ouro Feel simulator jobs and the Swift build and test run on main and releases, never on a pull request:
          # a pull request is judged by the Linux checks only, and a red main is the alarm. The required gates pass on these outputs.
          echo "gallery=false" >> "$GITHUB_OUTPUT"
          echo "feel=false" >> "$GITHUB_OUTPUT"
          # The README's first screen is built as a new app from the README (scripts/readme-app.sh).
          if grep -E "^(README\.md\$|Sources/OuroHX/|scripts/readme-app\.sh\$$shared)" changed.txt; then
            echo "readme=true" >> "$GITHUB_OUTPUT"
          else
            echo "readme=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(Sources/(OuroAX|OuroAXTesting|OuroAXTestingProbe|OuroAXSkillsLint|ouro-ax-xray|OuroFeel|OuroFeelCore|OuroFeelRecorder)/|Templates/XrayProbe/|Examples/(OuroAXXrayFixture|OuroFeelFixture)/|scripts/(xray-probe|ouro-feel-cold|select-xcode)\.sh$|\.github/workflows/|Package\.(swift|resolved)$)' changed.txt; then
            echo "xray=true" >> "$GITHUB_OUTPUT"
          else
            echo "xray=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The gallery's and Ouro Feel's shard plans match their UI tests
        run: python3 -I scripts/ui-shards.py check

  provenance:
    name: Core provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Downloads retry GitHub's own failures, never a missing file
        run: python3 -I scripts/test-check-provenance.py
      - name: Vendored files match ouro-ui-core's release, byte for byte
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/check-provenance.py
      - name: One changed byte fails the check
        run: |
          set -u
          printf ' ' >> Sources/OuroHX/Tokens/OuroTokens.swift
          python3 -I scripts/check-provenance.py --offline && status=0 || status=$?
          git checkout -- Sources/OuroHX/Tokens/OuroTokens.swift
          test "$status" -eq 3
          printf ' ' >> Sources/OuroAXTesting/Resources/apple.claims.json
          python3 -I scripts/check-provenance.py --offline && status=0 || status=$?
          git checkout -- Sources/OuroAXTesting/Resources/apple.claims.json
          test "$status" -eq 3
          printf ' ' >> Sources/OuroHXTesting/Resources/components.claims.json
          python3 -I scripts/check-provenance.py --offline && status=0 || status=$?
          git checkout -- Sources/OuroHXTesting/Resources/components.claims.json
          test "$status" -eq 3
          printf ' ' >> Tests/OuroA2UITests/Conformance/cases/recipe-card-agent.json
          python3 -I scripts/check-provenance.py --offline && status=0 || status=$?
          git checkout -- Tests/OuroA2UITests/Conformance/cases/recipe-card-agent.json
          test "$status" -eq 3
      - name: Shards find their build, including after "re-run failed jobs"
        run: sh scripts/test-ci-wait-for-build.sh
      - name: The release gate reads main's macOS proof
        run: sh scripts/test-release-gate.sh
      - name: UI shards retry the machine's failures, never the app's
        run: sh scripts/test-ci-ui-infra.sh

  xcode-27:
    name: Build and test with Xcode 27 (main and releases only)
    # xcode-27 is GitHub's billed hosted image with Xcode 27 (image xcode-27-arm64). It compiles what the free image
    # fences out: the iOS 27.1 hinge APIs (`#if canImport(SwiftUICore, _version: 8.0.85)`) and AppIntentsTesting.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 27.2 or later
        run: sh scripts/select-xcode.sh 27.2
      # OURO_REQUIRE_HINGE turns a fenced-out hinge into a build error, so this SDK proves the hinge code compiles.
      - name: swift build
        run: swift build --build-tests -Xswiftc -DOURO_REQUIRE_HINGE
      - name: swift test
        run: swift test -Xswiftc -DOURO_REQUIRE_HINGE
      - id: upload1
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-actual-xcode-27
          path: Tests/OuroHXTests/__Snapshots__/**/*.actual.png
          if-no-files-found: ignore
      - if: always() && steps.upload1.outcome == 'failure'
        run: echo "::warning::The snapshots-actual-xcode-27 artifact did not upload (see the step's log); the job's result stands without it."
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS='$(inherited) -DOURO_REQUIRE_HINGE' 2>&1 | tail -40

  oldest-xcode-27:
    name: Build with Xcode ${{ matrix.xcode }}'s SDKs (main and releases only)
    # Xcode 27.0 and 27.1 have Swift 6.4 with older SDKs (macOS 27.0; iOS 27.0 and 27.1). A fence on the compiler let
    # 27.2-SDK code into these builds (ouro-ui-apple#6), so each one builds here, and prints its SwiftUICore versions
    # so the hinge fence's threshold can be checked against them.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        xcode: ["27.0", "27.1"]
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sh scripts/select-xcode.sh --exact ${{ matrix.xcode }}
      - name: SwiftUICore versions in this Xcode's SDKs
        run: |
          for sdk in macosx iphoneos iphonesimulator; do
            path="$(xcrun --sdk "$sdk" --show-sdk-path)"
            file="$(ls "$path"/System/Library/Frameworks/SwiftUICore.framework/Modules/SwiftUICore.swiftmodule/*.swiftinterface | grep -v macabi | head -1)"
            echo "$sdk $(xcrun --sdk "$sdk" --show-sdk-version): SwiftUICore $(grep -o 'user-module-version [0-9.]*' "$file" | head -1 | cut -d' ' -f2)," \
              "hinge APIs: $(grep -q 'func onHingeChange' "$file" && echo declared || echo absent)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: swift build (macOS SDK)
        run: swift build --build-tests
      # The iOS 27.1 SDK declares the hinge APIs, so with Xcode 27.1 the iOS build must compile them.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          require=""
          [ '${{ matrix.xcode }}' = '27.1' ] && require='-DOURO_REQUIRE_HINGE'
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS="\$(inherited) $require" 2>&1 | tail -40

  readme-app:
    name: The README's first screen, as a new app (free macos-26)
    # A newcomer's path: a new app from the README's Install lines and its "A first screen", built for the Mac and the
    # iOS Simulator against this checkout. Runs when the README, OuroHX or the workflow changes, and on every push.
    needs: paths
    if: needs.paths.outputs.readme == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build the README's first screen as a new app
        run: scripts/readme-app.sh "$RUNNER_TEMP/readme-app"

  api-break:
    name: Public API against the last release (free macos-26)
    # README, "Source stability": a source break waits for the next major. Pull requests only; before 0.9.0 it reports.
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: diagnose-api-breaking-changes against the newest vX.Y.Z tag
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/api-break.sh

  swift:
    name: Build, test, DocC and gallery (free macos-26, Xcode 26)
    # GitHub's free standard image. Its Xcode 26 lacks the iOS 27 SDK, so the hinge APIs, AppIntentsTesting and the
    # Siri AI parts compile out behind compiler and canImport checks; the xcode-27 job covers them on main.
    # Not on a pull request: macOS runners are scarce, so a PR never waits for one. It runs on main and releases, and a red run on main is the red-main alarm.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift build
        run: swift build --build-tests
      - name: swift test
        run: swift test --skip ComponentSnapshotTests
      # A missing or changed component snapshot fails the job (in the last step, so the builds and DocC below still
      # run); its render goes up as an artifact to record from.
      - name: Component snapshots (references in Tests/OuroHXTests/__Snapshots__/macOS-<major>)
        id: snapshots
        continue-on-error: true
        run: OURO_SNAPSHOT_RECORD=never swift test --filter ComponentSnapshotTests
      - id: upload2
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-actual-macos-26
          path: Tests/OuroHXTests/__Snapshots__/**/*.actual.png
          if-no-files-found: ignore
      - if: always() && steps.upload2.outcome == 'failure'
        run: echo "::warning::The snapshots-actual-macos-26 artifact did not upload (see the step's log); the job's result stands without it."
      - name: The skills linter, as an agent runs it
        run: |
          set -u
          swift run ouro-ax-skills lint Tests/OuroAXSkillsLintTests/Fixtures/Good/Skills.skillsbundle --json
          swift run ouro-ax-skills lint Tests/OuroAXSkillsLintTests/Fixtures/Bad/Skills.skillsbundle --json && status=0 || status=$?
          test "$status" -eq 3
      - name: Ouro Reins, as an agent runs it (ls, do, a refusal, the exit codes)
        run: |
          set -u
          swift build --product ouro-reins-sample
          bin="$(swift build --show-bin-path)/ouro-reins-sample"
          "$bin" ls 'do openItem {"id":"flour"}' 'do toggleStocked' 'do goBack' > .build/reins-ok.ndjson
          printf 'ls\ndo nope\n{"id":3,"op":"do","action":"openItem","input":{"id":7}}\n' | "$bin" > .build/reins-refused.ndjson && status=0 || status=$?
          test "$status" -eq 2
          python3 -I - .build/reins-ok.ndjson .build/reins-refused.ndjson <<'PY'
          import json, sys
          ok = [json.loads(l) for l in open(sys.argv[1])]
          assert [r["ok"] for r in ok] == [True] * 4, ok
          assert [r["screen"]["focus"] for r in ok] == ["list", "item", "item", "list"], ok
          assert ok[2]["screen"]["state"]["stocked"] is False, ok[2]
          bad = [json.loads(l) for l in open(sys.argv[2])]
          assert bad[1]["error"]["code"] == "action-unavailable" and "openItem" in bad[1]["error"]["fix"], bad[1]
          assert bad[2]["id"] == 3 and bad[2]["error"]["code"] == "input-invalid", bad[2]
          print("reins: ls/do round trip and refusals as documented")
          PY
      - name: Ouro Reins' debug socket is compiled out of release
        run: sh scripts/check-reins-release.sh
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      - name: DocC
        run: sh scripts/docc.sh .build/docc
      - name: Build the gallery app
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroHXGallery && xcodegen generate)
          xcodebuild build -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/gallery CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      # DocC file names hold colons, which upload-artifact refuses, so the archives go up as one tarball.
      - name: Pack DocC
        run: tar -czf .build/docc.tgz -C .build docc
      - id: upload3
        # A copy of what the job built: a storage outage must not turn a passing job red (#35).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: docc
          path: .build/docc.tgz
      - if: steps.upload3.outcome == 'failure'
        run: echo "::warning::The docc artifact did not upload (see the step's log); the job's result stands without it."
      - name: Component snapshots matched
        if: steps.snapshots.outcome == 'failure'
        run: |
          echo "::error::A component snapshot is missing or changed. Record it from the snapshots-actual-macos-26 artifact into Tests/OuroHXTests/__Snapshots__/macOS-26."
          exit 1

  gallery-build:
    name: Gallery build for testing (free macos-26, Xcode 26)
    # Builds the gallery and its UI tests once; the four shards below test that build on their own simulators. Pull
    # requests run it only when they change what the gallery links (the `paths` job).
    needs: paths
    if: needs.paths.outputs.gallery == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: key
        name: The build's name, by commit, Xcode and run attempt
        run: |
          set -eu
          xcode="$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')"
          echo "artifact=gallery-tests-$GITHUB_SHA-xcode-$xcode-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build the gallery and its UI tests once
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroHXGallery && xcodegen generate)
          xcodebuild build-for-testing -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery \
            -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" \
            -derivedDataPath .build/gallery CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
          ls .build/gallery/Build/Products/*.xctestrun
          # Uncompressed: the upload compresses it, and a single-threaded gzip here would hold the shards up.
          tar -cf .build/gallery-products.tar -C .build/gallery/Build Products
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.artifact }}
          path: .build/gallery-products.tar
          retention-days: 2
          compression-level: 1
          if-no-files-found: error

  gallery-motion:
    name: Gallery hitch probe (main and releases, report only)
    # MotionTests in a Release build, as people run it: a Debug SwiftUI build hitches where the shipped one does not.
    # Reported, not gated, on this hosted VM: it has no GPU, and its frame timing swings run to run. On one commit
    # (a41b0ae vs 8c02d4e's identical components), sheet, toast and stack passed in one run and failed all three tries in
    # the next (#25). The 5 ms/s limit is unchanged and gates on a Mac's simulator and on device; a failure here leaves a
    # warning and the result bundle. Not on pull requests: its Release build cost each one 9 minutes. The Gallery UI
    # check does not wait for it.
    needs: paths
    if: github.event_name != 'pull_request' && needs.paths.outputs.gallery == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: A simulator, booting while the build runs
        run: python3 -I scripts/ci-simulator.py start ouro-hx-motion
      - name: Build the gallery for Release
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroHXGallery && xcodegen generate)
          xcodebuild build-for-testing -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery -configuration Release \
            -destination "id=$UDID" -derivedDataPath .build/gallery-release CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      - name: The simulator finished booting
        timeout-minutes: 16
        run: python3 -I scripts/ci-simulator.py wait ouro-hx-motion 240
      - name: Every transition is smooth (hitch probe, Release build)
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery -configuration Release \
            -destination "id=$UDID" -derivedDataPath .build/gallery-release -resultBundlePath .build/gallery-motion.xcresult \
            -only-testing:OuroHXGalleryUITests/MotionTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error|failed|passed|skipped|Executed|TEST" | tail -60 \
            || { echo "::warning title=Motion over the limit on the hosted VM::See the MotionTests results above and gallery-motion.xcresult (#25)."; exit 1; }
      - if: always()
        name: Pack the result bundle
        run: test -d .build/gallery-motion.xcresult && tar -czf .build/gallery-motion.tgz -C .build gallery-motion.xcresult || true
      - id: upload4
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-motion-xcresult
          path: .build/gallery-motion.tgz
          if-no-files-found: ignore
      - if: always() && steps.upload4.outcome == 'failure'
        run: echo "::warning::The gallery-motion-xcresult artifact did not upload (see the step's log); the job's result stands without it."

  gallery-shard:
    name: Gallery UI shard ${{ matrix.shard }} of 4 on ${{ matrix.device }} (free macos-26, Xcode 26)
    # performAccessibilityAudit on every component page at the default and the largest text size, in light and dark,
    # plus 44-point targets, VoiceOver names, close controls and the waiting action toast, split four ways by measured
    # time (scripts/ui-shards.py). Each shard starts once the build has passed, boots its simulator while it fetches
    # the build's products, then tests them. Shards don't start alongside the build: under a runner backlog they held
    # macOS runners idle for 8.7 min waiting on a build that hadn't started (#70's run 42440823585), and the build
    # takes about a minute. Pull requests run them only when they change what the gallery links, on an iPhone; main
    # and releases run them on an iPhone and on a 13-inch iPad, where a layout that doesn't fill the screen shows.
    needs: [paths, gallery-build]
    if: needs.paths.outputs.gallery == 'true'
    runs-on: macos-26
    # One run of a shard takes about 19 minutes, and an infrastructure retry (below) runs it again: 40 minutes cancelled
    # the retry partway (#162).
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        device: ${{ fromJSON(github.event_name == 'pull_request' && '["iPhone"]' || '["iPhone", "iPad"]') }}
    env:
      OURO_SIM_FAMILY: ${{ matrix.device }}
    # A runner whose simulator service is broken (#74) is known within about a minute: the shard marks it
    # (scripts/ci-broken-runner.sh), skips its other steps and ends, and gallery-requeue runs it on a fresh runner.
    steps: &gallery-shard-steps
      - uses: actions/checkout@v4
      - name: A simulator for this shard, booting while the build downloads
        env:
          BREAK: ${{ inputs.break_shard }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          python3 -I scripts/ci-simulator.py --selftest
          if [ "${OURO_REQUEUED:-0}" != 1 ] && echo " $BREAK " | grep -q " gallery-$SHARD-$OURO_SIM_FAMILY "; then
            sh scripts/ci-broken-runner.sh "A manual run asked to treat this runner as broken"
          else
            python3 -I scripts/ci-simulator.py start ouro-hx-ui || sh scripts/ci-broken-runner.sh "The simulator could not be created"
          fi
      - id: key
        if: env.OURO_BROKEN_RUNNER != '1'
        name: The build this shard tests, by commit and Xcode
        run: |
          set -eu
          xcode="$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')"
          echo "prefix=gallery-tests-$GITHUB_SHA-xcode-$xcode-attempt-" >> "$GITHUB_OUTPUT"
      - id: artifact
        if: env.OURO_BROKEN_RUNNER != '1'
        name: The build is ready
        # Finds this attempt's build, or the earlier attempt's after "re-run failed jobs".
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci-wait-for-build.sh "${{ steps.key.outputs.prefix }}" "Gallery build for testing"
      - uses: actions/download-artifact@v4
        if: env.OURO_BROKEN_RUNNER != '1'
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .build
      - name: Unpack the build
        if: env.OURO_BROKEN_RUNNER != '1'
        env:
          SHARD: ${{ matrix.shard }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh scripts/ci-unpack-build.sh .build/gallery-products.tar .build/gallery/Build "${{ steps.artifact.outputs.name }}"
          set -- .build/gallery/Build/Products/*.xctestrun
          xctestrun="$1"; test -f "$xctestrun"
          echo "XCTESTRUN=$PWD/$xctestrun" >> "$GITHUB_ENV"
          # The audit's page filter goes into the test run's own environment, not through xcodebuild's TEST_RUNNER_.
          python3 -I scripts/ui-shards.py gallery env "$xctestrun" "OURO_AUDIT_PAGES=$(python3 -I scripts/ui-shards.py gallery pages "$SHARD")"
      # Booted and settled before the tests start, as the X-ray probe does: a cold boot under the first test was where
      # the runner lost testmanagerd (main, run 42166414006). A boot that hangs or aborts gets one fresh device.
      - name: The simulator finished booting
        if: env.OURO_BROKEN_RUNNER != '1'
        timeout-minutes: 16
        run: python3 -I scripts/ci-simulator.py wait ouro-hx-ui 240 || sh scripts/ci-broken-runner.sh "The simulator did not boot, on two devices"
      - name: Gallery UI tests, shard ${{ matrix.shard }}
        if: env.OURO_BROKEN_RUNNER != '1'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -u
          mkdir -p .build
          only="$(python3 -I scripts/ui-shards.py gallery args "$SHARD")"
          pages="$(python3 -I scripts/ui-shards.py gallery pages "$SHARD")"
          echo "Shard $SHARD runs:"; echo "$only"; test -n "$pages" && echo "Audit pages: $pages"
          gallery() {
            # A hung xcodebuild (its log quiet for 10 minutes) is stopped, and counts as the machine's failure (#164).
            # shellcheck disable=SC2086
            sh scripts/ci-quiet-watch.sh 600 ".build/$1.log" xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
              -destination "id=$UDID" -resultBundlePath ".build/$1.xcresult" $only
          }
          # A runner that loses testmanagerd, never bootstraps or can't find the simulator it just booted (#42) ran
          # nothing wrong in the app: that is the machine, so it gets one more run on a rebooted simulator, reported as an
          # infrastructure retry. So does a run that lost the simulator's accessibility (#84), and one whose only failures
          # are screenshot requests the simulator never answered (#43); a real assertion failure next to one still fails.
          # Any other failure fails. The check is scripts/ci-ui-infra.sh, shared with the Ouro Feel shards.
          infra() { sh scripts/ci-ui-infra.sh ".build/$1.log" ".build/$1.xcresult"; }
          name="gallery-ui-$SHARD-$OURO_SIM_FAMILY"
          status=0; gallery "$name" || status=$?
          grep -E "error|failed|passed|Executed|TEST" ".build/$name.log" | tail -80
          # A simulator service that went away mid-run doesn't come back on this runner (#74): requeue the shard on a
          # fresh one rather than rebooting here.
          if [ "$status" -ne 0 ] && cause="$(infra "$name")" && echo "$cause" | grep -qE "wrote nothing|active applications|Unable to find a device"; then
            if [ -e ".build/$name.xcresult" ]; then mv ".build/$name.xcresult" ".build/$name-attempt-1.xcresult"; fi
            mv ".build/$name.log" ".build/$name-attempt-1.log"
            sh scripts/ci-broken-runner.sh "Gallery UI shard $SHARD: \"$cause\""; exit $?
          fi
          if [ "$status" -ne 0 ] && cause="$(infra "$name")"; then
            echo "::warning title=Infrastructure retry::Gallery UI shard $SHARD: \"$cause\". Rebooting the simulator and running it once more; the first attempt's log, and its result bundle where one was written, are kept as $name-attempt-1."
            # A runner that never bootstrapped may have left no bundle; one that did must move it, or xcodebuild
            # refuses to write the next.
            if [ -e ".build/$name.xcresult" ]; then mv ".build/$name.xcresult" ".build/$name-attempt-1.xcresult"; fi
            mv ".build/$name.log" ".build/$name-attempt-1.log"
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b >/dev/null
            status=0; gallery "$name" || status=$?
            grep -E "error|failed|passed|Executed|TEST" ".build/$name.log" | tail -80
            # The machine again, after the reboot: a fresh runner, not a third run here.
            if [ "$status" -ne 0 ] && cause="$(infra "$name")"; then
              mv ".build/$name.log" ".build/$name-attempt-2.log"
              if [ -e ".build/$name.xcresult" ]; then mv ".build/$name.xcresult" ".build/$name-attempt-2.xcresult"; fi
              sh scripts/ci-broken-runner.sh "Gallery UI shard $SHARD, after a reboot: \"$cause\""; exit $?
            fi
          fi
          if [ "$status" -eq 0 ]; then
            # A shard that ran nothing, or an audit that ran no page, would pass on nothing: what ran must be the plan.
            python3 -I scripts/ui-shards.py gallery ran "$SHARD" ".build/$name.xcresult" || status=1
          fi
          exit "$status"
      - if: always()
        name: Pack the result bundle
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          bundles="$(cd .build && ls -d gallery-ui-"$SHARD-$OURO_SIM_FAMILY"*.xcresult gallery-ui-"$SHARD-$OURO_SIM_FAMILY"*.log 2>/dev/null || true)"
          test -n "$bundles" && tar -czf ".build/gallery-ui-$SHARD-$OURO_SIM_FAMILY.tgz" -C .build $bundles || true
      - id: upload4
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-ui-xcresult-${{ matrix.shard }}-${{ matrix.device }}${{ env.OURO_REQUEUED == '1' && '-requeued' || '' }}
          path: .build/gallery-ui-${{ matrix.shard }}-${{ matrix.device }}.tgz
          if-no-files-found: ignore
      - if: always() && steps.upload4.outcome == 'failure'
        run: echo "::warning::The gallery-ui-xcresult-${{ matrix.shard }}-${{ matrix.device }} artifact did not upload (see the step's log); the job's result stands without it."

  gallery-requeue-plan:
    name: Gallery shards a broken runner stopped (#74)
    # Lists the gallery shards that marked their runner broken (scripts/ci-broken-runner.sh), from their annotations.
    needs: [paths, gallery-shard]
    if: always() && needs.paths.outputs.gallery == 'true' && needs.gallery-shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -I scripts/ci-requeue-plan.py --selftest
          python3 -I scripts/ci-requeue-plan.py gallery "${{ github.run_id }}"

  gallery-requeue:
    name: Gallery UI shard ${{ matrix.shard }} of 4 on ${{ matrix.device }}, requeued on a fresh runner (free macos-26, Xcode 26)
    # The same steps as gallery-shard, on a fresh runner, for each shard a broken runner stopped (#74). A second broken
    # runner fails here, and ci-rerun-broken-runner.py reruns it once the run ends.
    needs: [paths, gallery-build, gallery-requeue-plan]
    if: always() && needs.gallery-requeue-plan.result == 'success' && needs.gallery-requeue-plan.outputs.shards != '[]'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gallery-requeue-plan.outputs.shards) }}
    env:
      OURO_SIM_FAMILY: ${{ matrix.device }}
      OURO_REQUEUED: "1"
    steps: *gallery-shard-steps

  gallery-ui:
    name: Gallery UI tests, the component claims (free macos-26, Xcode 26)
    # The required check. It passes only when the build and every shard passed, or when the change does not touch the
    # gallery. It runs even when they fail or the run is cancelled (`always()`), so a red or cancelled shard can never
    # leave this check skipped, which GitHub counts as a pass.
    # A shard a broken runner stopped counts only through its requeue on a fresh runner (#74).
    needs: [paths, gallery-build, gallery-shard, gallery-requeue-plan, gallery-requeue]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          PATHS: ${{ needs.paths.result }}
          GALLERY: ${{ needs.paths.outputs.gallery }}
          BUILD: ${{ needs.gallery-build.result }}
          SHARDS: ${{ needs.gallery-shard.result }}
          PLAN: ${{ needs.gallery-requeue-plan.result }}
          REQUEUED: ${{ needs.gallery-requeue-plan.outputs.shards }}
          REQUEUE: ${{ needs.gallery-requeue.result }}
        run: |
          set -eu
          echo "paths=$PATHS gallery=$GALLERY build=$BUILD shards=$SHARDS plan=$PLAN requeued=$REQUEUED requeue=$REQUEUE"
          if [ "$PATHS" != success ]; then echo "::error::The paths job ended $PATHS"; exit 1; fi
          if [ "$GALLERY" = false ]; then echo "This change doesn't touch what the gallery links."; exit 0; fi
          if [ "$BUILD" != success ] || [ "$SHARDS" != success ]; then echo "::error::Build $BUILD, shards $SHARDS"; exit 1; fi
          if [ "$PLAN" != success ]; then echo "::error::Could not tell which shards a broken runner stopped (plan $PLAN)"; exit 1; fi
          if [ "$REQUEUED" = "[]" ]; then echo "The build and every shard passed, on each device."; exit 0; fi
          if [ "$REQUEUE" = success ]; then echo "Every shard passed, on each device; $REQUEUED passed on fresh runners after a broken one (#74)."; exit 0; fi
          echo "::error::$REQUEUED were requeued after a broken runner, and the requeue ended $REQUEUE"; exit 1

  gallery-duo:
    name: Gallery on an iPhone Duo, folded (xcode-27, Xcode 27.1)
    # FoldPostureTests on an iPhone Duo simulator whose hinge Device Hub really moves: `ouro-devicehub serve` answers the
    # test's requests (OuroDuoHinge). It checks the sheet, item and card in a book and a tabletop (Folding.md). Only
    # xcode-27 has the iPhone Duo (iOS 27.1 runtimes) and the hinge APIs (Xcode 27.1's SDK). It is billed, so it runs
    # on main, releases and a manual dispatch only, never on a pull request, which keeps it inside the runner's monthly
    # cap. As Gatefold's Duo tour, it drives Device Hub's window on the runner.
    # A dispatch that only proves the requeue (`break_shard`, #74, or `slow_shard`, #199) skips it.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.break_shard == '' && inputs.slow_shard == '')
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      OURO_SIM_FAMILY: Duo
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 27.1 for this job only
        run: |
          set -eu
          for app in /Applications/Xcode_*.app; do
            v="$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || true)"
            if [ "$v" = "27.1" ] || [ "$v" = "27.1.0" ]; then echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"; echo "Using $app ($v)"; exit 0; fi
          done
          ls -d /Applications/Xcode_*.app; exit 1
      - name: An iPhone Duo, booting while the gallery builds
        run: |
          set -eu
          python3 -I scripts/ci-simulator.py --selftest
          python3 -I scripts/ci-simulator.py start ouro-hx-duo
      - name: Build the gallery, its UI tests and ouro-devicehub
        run: |
          set -eo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroHXGallery && xcodegen generate)
          xcodebuild build-for-testing -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/duo CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -DOURO_REQUIRE_HINGE' 2>&1 | tail -30
          swift build -c release --product ouro-devicehub
          echo "HUB=$(swift build -c release --show-bin-path)/ouro-devicehub" >> "$GITHUB_ENV"
      - name: The iPhone Duo finished booting
        timeout-minutes: 16
        run: python3 -I scripts/ci-simulator.py wait ouro-hx-duo 240
      - name: Open Device Hub
        run: |
          set -eu
          open -a "$(xcode-select -p)/../Applications/DeviceHub.app"
          sleep 20
          "$HUB" dump
      - name: FoldPostureTests, the hinge moved by Device Hub
        timeout-minutes: 25
        run: |
          set -u
          dir="$RUNNER_TEMP/duo"; mkdir -p "$dir"
          "$HUB" serve "$dir" > "$RUNNER_TEMP/devicehub.log" 2>&1 &
          serve=$!
          status=0
          TEST_RUNNER_OURO_DUO_POSTURE_DIR="$dir" xcodebuild test-without-building \
            -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery -destination "id=$UDID" \
            -derivedDataPath .build/duo -only-testing:OuroHXGalleryUITests/FoldPostureTests \
            -resultBundlePath .build/duo.xcresult > .build/duo.log 2>&1 || status=$?
          kill "$serve" 2>/dev/null || true
          grep -E "error|failed|passed|skipped|Executed|TEST" .build/duo.log | tail -60
          echo "Device Hub driver:"; tail -20 "$RUNNER_TEMP/devicehub.log"
          # A skip means the request directory never reached the test, so nothing was folded: that fails here.
          if grep -q "Test Case .* skipped" .build/duo.log; then echo "::error::FoldPostureTests skipped: the hinge never reached it"; exit 1; fi
          exit $status
      - id: upload-duo
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-duo
          path: |
            .build/duo.xcresult
            .build/duo.log
            ${{ runner.temp }}/duo/shots
            ${{ runner.temp }}/devicehub.log

  xray:
    name: X-ray the fixture app (${{ matrix.name }})
    # The behaviour stage needs an Xcode whose AppIntentsTesting matches the OS it runs on: Xcode 27.2's needs a 27.2
    # OS. The iOS lanes pin an Xcode to a simulator runtime this image has (27.0 and 27.1). The macOS lane runs on the
    # host itself, and the xcode-27 pool hands out both macOS 27.0.1 and 27.2 machines, so it picks the Xcode that
    # matches the host it got: its pinned 27.1 on a 27.0 or 27.1 host, the host's own version otherwise (#217). See
    # docs/decisions/2026-11-03-ax-xray.md.
    needs: paths
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.paths.outputs.xray == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "iOS 27.1 simulator, Xcode 27.1", xcode: "27.1", platform: ios, runtime: "27.1", device: "iPhone Duo", destination: "generic/platform=iOS Simulator", expect: full }
          - { name: "iOS 27.0 simulator, Xcode 27.0", xcode: "27.0", platform: ios, runtime: "27.0", device: "iPhone 17 Pro", destination: "generic/platform=iOS Simulator", expect: full }
          - { name: "macOS, Xcode to match the host", xcode: "27.1", platform: macos, runtime: "", device: "", destination: "platform=macOS", expect: signed }
          # macOS: AppIntentsTesting refuses a probe that is not signed by the app's team (AppIntentsServicesSecurityErrorDomain
          # 800). With the Apple Development certificate (APPLE_DEVELOPMENT_CERTIFICATE_*), the app and the probe are signed
          # by one team and the probe must reach the app ("signed"). Without it (a fork's pull request has no secrets), this
          # lane proves the refusal is reported as a skip with the fix, not as the app failing ("refused").
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode ${{ matrix.xcode }}, or the macOS host's own version, for this job only
        run: |
          set -eu
          want='${{ matrix.xcode }}'
          if [ '${{ matrix.platform }}' = macos ]; then
            # The probe runs on this host, so its AppIntentsTesting must match the host's macOS (#217).
            host="$(sw_vers -productVersion | cut -d. -f1,2)"
            case "$host" in 27.0|27.1) ;; *) want="$host" ;; esac
            echo "macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion)); the probe needs Xcode $want"
          fi
          for app in /Applications/Xcode_*.app; do
            v="$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || true)"
            if [ "$v" = "$want" ] || [ "$v" = "$want.0" ]; then echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"; echo "Using $app ($v)"; exit 0; fi
          done
          ls -d /Applications/Xcode_*.app
          echo "::error::No Xcode $want on this runner. The X-ray probe needs the Xcode that matches the OS it runs on; another one builds a probe that can't load (#217)."
          exit 1
      - name: Tools
        run: |
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          swift build -c release --product ouro-ax-xray
      - id: signing
        if: matrix.platform == 'macos'
        uses: ./.github/actions/import-apple-development-cert
        with:
          certificate-base64: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
      - name: Build the fixture app with the same Xcode
        run: |
          set -o pipefail
          (cd Examples/OuroAXXrayFixture && xcodegen generate)
          xcodebuild build -project Examples/OuroAXXrayFixture/OuroAXXrayFixture.xcodeproj -scheme OuroAXXrayFixture \
            -destination '${{ matrix.destination }}' -derivedDataPath .build/fixture CODE_SIGN_IDENTITY=- 2>&1 | tail -20
          find .build/fixture/Build/Products -maxdepth 2 -name XrayFixture.app
      - name: X-ray it, metadata and behaviour
        # A passing probe takes 9 to 21 minutes. Its own limit, inside the job's, fails a hang here with the log kept
        # and the report still uploaded; at the job's limit GitHub cancels the job and keeps no log (#46). A probe that
        # goes quiet for 8 minutes is stopped and tried once more on a rebooted simulator (#207), so this leaves room
        # for that.
        timeout-minutes: 40
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          SIGN_TEAM: ${{ steps.signing.outputs.team }}
          SIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          set -eu
          app="$(find .build/fixture/Build/Products -maxdepth 2 -name XrayFixture.app | head -1)"
          set -- --app "$app" --out .build/xray --platform ${{ matrix.platform }} \
            --runtime "${{ matrix.runtime }}" --device-type "${{ matrix.device }}" --commit "$GITHUB_SHA" --disposable
          if [ "${{ matrix.platform }}" = ios ]; then set -- "$@" --ready-file Documents/ouro-ax-ready; fi
          if [ -n "${SIGN_IDENTITY:-}" ]; then set -- "$@" --sign-identity "$SIGN_IDENTITY" --team "$SIGN_TEAM" --keychain "$SIGN_KEYCHAIN"; fi
          sh scripts/xray-probe.sh "$@"
      - name: The probe saw the fixture's notes and its refusals
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          expect="${{ matrix.expect }}"
          if [ "$expect" = signed ]; then if [ -n "${SIGN_IDENTITY:-}" ]; then expect=reached; else expect=refused; fi; fi
          python3 -I - .build/xray/report.json "$expect" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          if sys.argv[2] == "reached":
              refused = [x for x in r["results"] if x["note"].startswith("AppIntentsTesting refused the probe")]
              print("results the system refused:", len(refused))
              assert not refused, "the signed probe was still refused: " + refused[0]["note"]
              sys.exit(0)
          if sys.argv[2] == "refused":
              n = {(x["claim"], x["surface"]): (x["verdict"], x["note"]) for x in r["results"]}
              for k in [("entity.ids-resolve", "entity NoteEntity"), ("entity.indexed", "entity NoteEntity")]:
                  print(k, n[k])
                  assert n[k][0] == "skip" and n[k][1].startswith("AppIntentsTesting refused the probe"), k
              sys.exit(0)
          v = {(x["claim"], x["surface"]): x["verdict"] for x in r["results"]}
          print(json.dumps({k[0] + " " + k[1]: x for k, x in v.items() if k[0] in ("entity.ids-resolve", "entity.indexed", "entity.transfer-round-trip", "annotation.onscreen", "intent.error-names-fix")}, indent=1))
          assert v[("entity.ids-resolve", "entity NoteEntity")] == "pass", "ids-resolve"
          n = {(x["claim"], x["surface"]): x["note"] for x in r["results"]}
          assert v[("entity.indexed", "entity NoteEntity")] == "pass", "indexed"
          assert v[("entity.transfer-round-trip", "entity NoteEntity")] == "pass", "round trip"
          refusal = n[("intent.error-names-fix", "intent OpenNoteIntent")]
          assert not refusal.startswith("the probe could not reach"), "the refusals reached the app: " + refusal
          PY
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true
      - id: upload5
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-fixture-${{ matrix.platform }}-${{ matrix.xcode }}
          path: .build/xray
      - if: always() && steps.upload5.outcome == 'failure'
        run: echo "::warning::The xray-fixture-${{ matrix.platform }}-${{ matrix.xcode }} artifact did not upload (see the step's log); the job's result stands, and the X-ray report is in the log above."

  siri-ai-sdk:
    name: Siri AI parts (Xcode 27.3 beta, compile only)
    # The tool-intent and SiriEvaluations code compiles only against the 27.3 beta SDK. When the image carries an
    # Xcode 27.3 or later, this lane builds with OURO_SIRI_AI_SDK set; until then it says so and passes.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Find Xcode 27.3 or later
        id: find
        run: |
          set -eu
          if sh scripts/select-xcode.sh 27.3; then echo "found=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::No Xcode 27.3 or later on the xcode-27 image yet; the Siri AI parts were not compiled here."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build with the Siri AI parts on
        if: steps.find.outputs.found == 'true'
        run: |
          swift build --build-tests -Xswiftc -DOURO_SIRI_AI_SDK
          set -o pipefail
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode-beta CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -DOURO_SIRI_AI_SDK' 2>&1 | tail -40

  feel-build:
    name: Ouro Feel fixture build for testing (free macos-26, Xcode 26)
    # Examples/OuroFeelFixture has one page per genre of jank with a known bug behind `-bug 1`; FeelCatchesTests proves
    # each check fails on the bug and passes without it. Built once here; the three shards below test that build on
    # their own simulators. Pull requests run it only when they change Ouro Feel, the fixture or what they share (the
    # `paths` job); main and releases always do.
    needs: paths
    if: needs.paths.outputs.feel == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: key
        name: The build's name, by commit, Xcode and run attempt
        run: |
          set -eu
          xcode="$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')"
          echo "artifact=feel-tests-$GITHUB_SHA-xcode-$xcode-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build the fixture and its UI tests once
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroFeelFixture && xcodegen generate)
          xcodebuild build-for-testing -project Examples/OuroFeelFixture/OuroFeelFixture.xcodeproj -scheme OuroFeelFixture \
            -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" \
            -derivedDataPath .build/feel-fixture CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
          ls .build/feel-fixture/Build/Products/*.xctestrun
          # Uncompressed: the upload compresses it, and a single-threaded gzip here would hold the shards up.
          tar -cf .build/feel-products.tar -C .build/feel-fixture/Build Products
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.artifact }}
          path: .build/feel-products.tar
          retention-days: 2
          compression-level: 1
          if-no-files-found: error

  feel-shard:
    name: ${{ matrix.shard == 'ipad' && 'Ouro Feel on an iPad, the iPhone fixture in compatibility mode' || format('Ouro Feel shard {0} of 3', matrix.shard) }} (free macos-26, Xcode 26)
    # FeelCatchesTests split three ways by measured time (scripts/ui-shards.py); each test launches its own app, so
    # order does not matter. Each shard starts once the build has passed (as the gallery's shards do, for the same
    # reason), boots its simulator while it fetches the build's products, then tests them.
    # The `ipad` lane runs only the clock-blanking tests on an iPad, where the fixture, an iPhone app, runs in
    # compatibility mode in a window smaller than the screen, to prove a screen film still blanks the clock (#73, item 2).
    needs: [paths, feel-build]
    if: needs.paths.outputs.feel == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, ipad]
    env:
      OURO_SIM_FAMILY: ${{ matrix.shard == 'ipad' && 'iPad' || 'iPhone' }}
    # A broken simulator service (#74) requeues the shard on a fresh runner, as the gallery's shards do.
    steps: &feel-shard-steps
      - uses: actions/checkout@v4
      - name: A fresh simulator for this shard, booting while the build downloads
        env:
          BREAK: ${{ inputs.break_shard }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          if [ "${OURO_REQUEUED:-0}" != 1 ] && echo " $BREAK " | grep -q " feel-$SHARD "; then
            sh scripts/ci-broken-runner.sh "A manual run asked to treat this runner as broken"
          else
            python3 -I scripts/ci-simulator.py start ouro-feel-ci || sh scripts/ci-broken-runner.sh "The simulator could not be created"
          fi
      - id: key
        if: env.OURO_BROKEN_RUNNER != '1'
        name: The build this shard tests, by commit and Xcode
        run: |
          set -eu
          xcode="$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')"
          echo "prefix=feel-tests-$GITHUB_SHA-xcode-$xcode-attempt-" >> "$GITHUB_OUTPUT"
      - id: artifact
        if: env.OURO_BROKEN_RUNNER != '1'
        name: The build is ready
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci-wait-for-build.sh "${{ steps.key.outputs.prefix }}" "Ouro Feel fixture build for testing"
      - uses: actions/download-artifact@v4
        if: env.OURO_BROKEN_RUNNER != '1'
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .build
      - name: Unpack the build
        if: env.OURO_BROKEN_RUNNER != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p .build/feel-reports
          sh scripts/ci-unpack-build.sh .build/feel-products.tar .build/feel-fixture/Build "${{ steps.artifact.outputs.name }}"
          set -- .build/feel-fixture/Build/Products/*.xctestrun
          xctestrun="$1"; test -f "$xctestrun"
          echo "XCTESTRUN=$PWD/$xctestrun" >> "$GITHUB_ENV"
          # Where OuroFeel writes its reports, in the test run's own environment.
          python3 -I scripts/ui-shards.py feel env "$xctestrun" "OURO_FEEL_REPORT_DIR=$PWD/.build/feel-reports"
      # Booted and settled before the tests: left to xcodebuild, the first test's setUp can reach a simulator whose
      # accessibility is not up yet ("Failed to get list of active applications", kAXError -25218).
      - name: The simulator finished booting
        if: env.OURO_BROKEN_RUNNER != '1'
        timeout-minutes: 16
        run: python3 -I scripts/ci-simulator.py wait ouro-feel-ci 240 || sh scripts/ci-broken-runner.sh "The simulator did not boot, on two devices"
      - name: Fixture UI tests, shard ${{ matrix.shard }} (a fresh simulator; only its first test starts cold, so reports say "not labelled")
        if: env.OURO_BROKEN_RUNNER != '1'
        env:
          SHARD: ${{ matrix.shard }}
          SLOW: ${{ inputs.slow_shard }}
        run: |
          set -u
          python3 -I scripts/ci-slow-watch.py --selftest
          # A manual run that asks for it (`slow_shard`) takes the first measured test to end as too slow, on the first run only.
          if [ "${OURO_REQUEUED:-0}" != 1 ] && echo " $SLOW " | grep -q " feel-$SHARD "; then export OURO_SLOW_FORCE=1; fi
          if [ "$SHARD" = ipad ]; then
            only="-only-testing:OuroFeelFixtureUITests/FeelCatchesTests/testTheClockIsBlankedInPortrait -only-testing:OuroFeelFixtureUITests/FeelCatchesTests/testTheClockIsBlankedInLandscape"
          else
            only="$(python3 -I scripts/ui-shards.py feel args "$SHARD")"
          fi
          echo "Shard $SHARD runs:"; echo "$only"
          fixture() {
            # A runner far slower than the measured times stops here, to be requeued, rather than run out of time (#199).
            : > .build/feel-fixture.log
            python3 -I scripts/ci-slow-watch.py feel .build/feel-fixture.log .build/feel-slow.txt & watch=$!
            # shellcheck disable=SC2086
            xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$UDID" \
              -resultBundlePath .build/feel-fixture.xcresult $only 2>&1 | tee .build/feel-fixture.log |
              { grep --line-buffered -E "\[ouro-feel\]|error|failed|passed|Executed|TEST" || true; }
            # Shown as it runs, so a hung run still shows how far it got; the full log is uploaded below. The status is
            # xcodebuild's own, not the filter's.
            local code="${PIPESTATUS[0]}"
            kill "$watch" 2>/dev/null || true
            return "$code"
          }
          # Stopped as too slow: the runner's fault, so a fresh runner, keeping this attempt's log and bundle.
          slow() {
            [ -s .build/feel-slow.txt ] || return 0
            mv .build/feel-fixture.log ".build/feel-fixture-attempt-$1.log"
            if [ -e .build/feel-fixture.xcresult ]; then mv .build/feel-fixture.xcresult ".build/feel-fixture-attempt-$1.xcresult"; fi
            sh scripts/ci-broken-runner.sh "Ouro Feel shard $SHARD: $(cat .build/feel-slow.txt)"; exit $?
          }
          status=0; fixture || status=$?
          slow 1
          # A simulator service that went away mid-run doesn't come back on this runner (#74): a fresh runner.
          if [ "$status" -ne 0 ] && cause="$(sh scripts/ci-ui-infra.sh .build/feel-fixture.log .build/feel-fixture.xcresult)" && echo "$cause" | grep -qE "wrote nothing|active applications|Unable to find a device"; then
            if [ -e .build/feel-fixture.xcresult ]; then mv .build/feel-fixture.xcresult .build/feel-fixture-attempt-1.xcresult; fi
            mv .build/feel-fixture.log .build/feel-fixture-attempt-1.log
            sh scripts/ci-broken-runner.sh "Ouro Feel shard $SHARD: \"$cause\""; exit $?
          fi
          # The machine, not the app (scripts/ci-ui-infra.sh, #84): one more run on a rebooted simulator, as the
          # gallery's shards get. The retry reruns the whole shard, so a real failure still fails.
          if [ "$status" -ne 0 ] && cause="$(sh scripts/ci-ui-infra.sh .build/feel-fixture.log .build/feel-fixture.xcresult)"; then
            echo "::warning title=Infrastructure retry::Ouro Feel shard $SHARD: \"$cause\". Rebooting the simulator and running it once more; the first attempt's log and result bundle are kept as feel-fixture-attempt-1."
            if [ -e .build/feel-fixture.xcresult ]; then mv .build/feel-fixture.xcresult .build/feel-fixture-attempt-1.xcresult; fi
            mv .build/feel-fixture.log .build/feel-fixture-attempt-1.log
            # The second run's reports start empty; the first run's go up beside them, as attempt-1.
            mv .build/feel-reports .build/feel-reports-attempt-1; mkdir -p .build/feel-reports
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b >/dev/null
            status=0; fixture || status=$?
            slow 2
            # The machine again, after the reboot: a fresh runner, not a third run here.
            if [ "$status" -ne 0 ] && cause="$(sh scripts/ci-ui-infra.sh .build/feel-fixture.log .build/feel-fixture.xcresult)"; then
              mv .build/feel-fixture.log .build/feel-fixture-attempt-2.log
              if [ -e .build/feel-fixture.xcresult ]; then mv .build/feel-fixture.xcresult .build/feel-fixture-attempt-2.xcresult; fi
              sh scripts/ci-broken-runner.sh "Ouro Feel shard $SHARD, after a reboot: \"$cause\""; exit $?
            fi
          fi
          # A shard that ran nothing would pass on nothing: what ran must be the plan.
          if [ "$status" -eq 0 ] && [ "$SHARD" = ipad ]; then
            ran="$(xcrun xcresulttool get test-results summary --path .build/feel-fixture.xcresult | python3 -I -c 'import json,sys; d=json.load(sys.stdin); print(d["totalTestCount"], d["passedTests"])')"
            if [ "$ran" != "2 2" ]; then echo "::error::The iPad lane ran and passed \"$ran\" (tests, passed), not its 2 clock tests"; status=1; fi
          elif [ "$status" -eq 0 ]; then python3 -I scripts/ui-shards.py feel ran "$SHARD" .build/feel-fixture.xcresult || status=1; fi
          exit "$status"
      - if: always()
        name: Pack the reports and result bundle
        run: |
          mkdir -p .build/feel-reports
          if [ -d .build/feel-reports-attempt-1 ]; then mv .build/feel-reports-attempt-1 .build/feel-reports/attempt-1; fi
          bundles="$(cd .build && ls -d feel-fixture*.xcresult 2>/dev/null || true)"
          test -n "$bundles" && tar -czf .build/feel-reports/feel-fixture-xcresult.tgz -C .build $bundles || true
          cp .build/feel-fixture*.log .build/feel-reports/ 2>/dev/null || true
      - id: upload6
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ouro-feel-fixture-reports-${{ matrix.shard }}${{ env.OURO_REQUEUED == '1' && '-requeued' || '' }}
          path: .build/feel-reports
          if-no-files-found: ignore
      - if: always() && steps.upload6.outcome == 'failure'
        run: echo "::warning::The ouro-feel-fixture-reports-${{ matrix.shard }} artifact did not upload (see the step's log); the job's result stands without it."

  feel-requeue-plan:
    name: Ouro Feel shards a broken runner stopped (#74)
    needs: [paths, feel-shard]
    if: always() && needs.paths.outputs.feel == 'true' && needs.feel-shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -I scripts/ci-requeue-plan.py feel "${{ github.run_id }}"

  feel-requeue:
    name: ${{ matrix.shard == 'ipad' && 'Ouro Feel on an iPad' || format('Ouro Feel shard {0} of 3', matrix.shard) }}, requeued on a fresh runner (free macos-26, Xcode 26)
    # The same steps as feel-shard, on a fresh runner, for each shard a broken runner stopped (#74).
    needs: [paths, feel-build, feel-requeue-plan]
    if: always() && needs.feel-requeue-plan.result == 'success' && needs.feel-requeue-plan.outputs.shards != '[]'
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.feel-requeue-plan.outputs.shards) }}
    env:
      OURO_REQUEUED: "1"
      OURO_SIM_FAMILY: ${{ matrix.shard == 'ipad' && 'iPad' || 'iPhone' }}
    steps: *feel-shard-steps

  feel-fixture:
    name: Ouro Feel catches every genre's bug (free macos-26, Xcode 26)
    # The required check. It passes only when the build and every shard passed, or when the change does not touch Ouro
    # Feel or its fixture. It runs even when they fail or the run is cancelled (`always()`), so a red or cancelled
    # shard can never leave this check skipped, which GitHub counts as a pass.
    # A shard a broken runner stopped counts only through its requeue on a fresh runner (#74).
    needs: [paths, feel-build, feel-shard, feel-requeue-plan, feel-requeue]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          PATHS: ${{ needs.paths.result }}
          FEEL: ${{ needs.paths.outputs.feel }}
          BUILD: ${{ needs.feel-build.result }}
          SHARDS: ${{ needs.feel-shard.result }}
          PLAN: ${{ needs.feel-requeue-plan.result }}
          REQUEUED: ${{ needs.feel-requeue-plan.outputs.shards }}
          REQUEUE: ${{ needs.feel-requeue.result }}
        run: |
          set -eu
          echo "paths=$PATHS feel=$FEEL build=$BUILD shards=$SHARDS plan=$PLAN requeued=$REQUEUED requeue=$REQUEUE"
          if [ "$PATHS" != success ]; then echo "::error::The paths job ended $PATHS"; exit 1; fi
          if [ "$FEEL" = false ]; then echo "This change doesn't touch Ouro Feel or its fixture."; exit 0; fi
          if [ "$BUILD" != success ] || [ "$SHARDS" != success ]; then echo "::error::Build $BUILD, shards $SHARDS"; exit 1; fi
          if [ "$PLAN" != success ]; then echo "::error::Could not tell which shards a broken runner stopped (plan $PLAN)"; exit 1; fi
          if [ "$REQUEUED" = "[]" ]; then echo "The build, all three shards and the iPad lane passed."; exit 0; fi
          if [ "$REQUEUE" = success ]; then echo "Every shard passed; $REQUEUED passed on fresh runners after a broken one (#74)."; exit 0; fi
          echo "::error::$REQUEUED were requeued after a broken runner, and the requeue ended $REQUEUE"; exit 1
