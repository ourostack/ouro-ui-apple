name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

# Where each check runs. Free hosted runners (ubuntu-latest, macos-26) run everything their Xcode 26 can: on every pull
# request and push. The billed xcode-27 runner (capped at $15 a month for this repository; usage stops at the cap) runs
# only what needs Xcode 27 or an iOS 27 OS, on pushes to main and on published releases. The X-ray lanes also run on a
# pull request that touches the X-ray, Ouro Feel, their fixtures or this workflow (the `paths` job), so a break is
# caught before merge rather than on main. The same job runs the simulator jobs (gallery, Feel fixture) on a pull
# request only when it changes what they link; main and releases run them always, and the gallery's report-only
# hitch probe runs only there. A red main is fixed by whoever merged the change that turned it red (AGENTS.md).
# Drop the xcode-27 lanes once macos-26 or macos-latest ships Xcode 27: move those steps onto that image and delete the
# `if:` gates below. No self-hosted runners.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths:
    name: What this change touches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      xray: ${{ steps.diff.outputs.xray }}
      gallery: ${{ steps.diff.outputs.gallery }}
      feel: ${{ steps.diff.outputs.feel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Does it touch the X-ray, Ouro Feel, their fixtures or the workflow?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Pushes and releases run every simulator job; these outputs only narrow pull requests.
          if [ "$EVENT" != pull_request ]; then printf 'xray=false\ngallery=true\nfeel=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE...$HEAD" > changed.txt
          shared='|\.github/workflows/|scripts/ci-simulator\.py$|Package\.(swift|resolved)$'
          # The gallery links OuroHX, OuroHXTesting (with OuroDeviceHub) and OuroFeel (Examples/OuroHXGallery/project.yml).
          if grep -E "^(Sources/(OuroHX|OuroHXTesting|OuroDeviceHub|OuroFeel[^/]*)/|Examples/OuroHXGallery/|scripts/gallery-shards\.py\$$shared)" changed.txt; then
            echo "gallery=true" >> "$GITHUB_OUTPUT"
          else
            echo "gallery=false" >> "$GITHUB_OUTPUT"
          fi
          # The Feel fixture links only OuroFeel, OuroFeelCore and OuroFeelRecorder (Examples/OuroFeelFixture/project.yml).
          if grep -E "^(Sources/OuroFeel[^/]*/|Examples/OuroFeelFixture/$shared)" changed.txt; then
            echo "feel=true" >> "$GITHUB_OUTPUT"
          else
            echo "feel=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(Sources/(OuroAX|OuroAXTesting|OuroAXTestingProbe|OuroAXSkillsLint|ouro-ax-xray|OuroFeel|OuroFeelCore|OuroFeelRecorder)/|Templates/XrayProbe/|Examples/(OuroAXXrayFixture|OuroFeelFixture)/|scripts/(xray-probe|ouro-feel-cold|select-xcode)\.sh$|\.github/workflows/|Package\.(swift|resolved)$)' changed.txt; then
            echo "xray=true" >> "$GITHUB_OUTPUT"
          else
            echo "xray=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Every gallery UI test and audit page is in exactly one shard
        run: python3 -I scripts/gallery-shards.py check

  provenance:
    name: Core provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Vendored files match ouro-ui-core's release, byte for byte
        run: python3 -I scripts/check-provenance.py
      - name: One changed byte fails the check
        run: |
          set -u
          printf ' ' >> Sources/OuroHX/Tokens/OuroTokens.swift
          python3 -I scripts/check-provenance.py --offline && status=0 || status=$?
          git checkout -- Sources/OuroHX/Tokens/OuroTokens.swift
          test "$status" -eq 3
          printf ' ' >> Sources/OuroAXTesting/Resources/apple.claims.json
          python3 -I scripts/check-provenance.py --offline && status=0 || status=$?
          git checkout -- Sources/OuroAXTesting/Resources/apple.claims.json
          test "$status" -eq 3
          printf ' ' >> Sources/OuroHXTesting/Resources/components.claims.json
          python3 -I scripts/check-provenance.py --offline && status=0 || status=$?
          git checkout -- Sources/OuroHXTesting/Resources/components.claims.json
          test "$status" -eq 3

  xcode-27:
    name: Build and test with Xcode 27 (main and releases only)
    # xcode-27 is GitHub's billed hosted image with Xcode 27 (image xcode-27-arm64). It compiles what the free image
    # fences out: the iOS 27.1 hinge APIs (`#if canImport(SwiftUICore, _version: 8.0.85)`) and AppIntentsTesting.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 27.2 or later
        run: sh scripts/select-xcode.sh 27.2
      # OURO_REQUIRE_HINGE turns a fenced-out hinge into a build error, so this SDK proves the hinge code compiles.
      - name: swift build
        run: swift build --build-tests -Xswiftc -DOURO_REQUIRE_HINGE
      - name: swift test
        run: swift test -Xswiftc -DOURO_REQUIRE_HINGE
      - id: upload1
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-actual-xcode-27
          path: Tests/OuroHXTests/__Snapshots__/**/*.actual.png
          if-no-files-found: ignore
      - if: always() && steps.upload1.outcome == 'failure'
        run: echo "::warning::The snapshots-actual-xcode-27 artifact did not upload (see the step's log); the job's result stands without it."
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS='$(inherited) -DOURO_REQUIRE_HINGE' 2>&1 | tail -40

  oldest-xcode-27:
    name: Build with Xcode ${{ matrix.xcode }}'s SDKs (main and releases only)
    # Xcode 27.0 and 27.1 have Swift 6.4 with older SDKs (macOS 27.0; iOS 27.0 and 27.1). A fence on the compiler let
    # 27.2-SDK code into these builds (ouro-ui-apple#6), so each one builds here, and prints its SwiftUICore versions
    # so the hinge fence's threshold can be checked against them.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        xcode: ["27.0", "27.1"]
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sh scripts/select-xcode.sh --exact ${{ matrix.xcode }}
      - name: SwiftUICore versions in this Xcode's SDKs
        run: |
          for sdk in macosx iphoneos iphonesimulator; do
            path="$(xcrun --sdk "$sdk" --show-sdk-path)"
            file="$(ls "$path"/System/Library/Frameworks/SwiftUICore.framework/Modules/SwiftUICore.swiftmodule/*.swiftinterface | grep -v macabi | head -1)"
            echo "$sdk $(xcrun --sdk "$sdk" --show-sdk-version): SwiftUICore $(grep -o 'user-module-version [0-9.]*' "$file" | head -1 | cut -d' ' -f2)," \
              "hinge APIs: $(grep -q 'func onHingeChange' "$file" && echo declared || echo absent)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: swift build (macOS SDK)
        run: swift build --build-tests
      # The iOS 27.1 SDK declares the hinge APIs, so with Xcode 27.1 the iOS build must compile them.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          require=""
          [ '${{ matrix.xcode }}' = '27.1' ] && require='-DOURO_REQUIRE_HINGE'
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS="\$(inherited) $require" 2>&1 | tail -40

  swift:
    name: Build, test, DocC and gallery (free macos-26, Xcode 26)
    # GitHub's free standard image. Its Xcode 26 lacks the iOS 27 SDK, so the hinge APIs, AppIntentsTesting and the
    # Siri AI parts compile out behind compiler and canImport checks; the xcode-27 job covers them on main.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift build
        run: swift build --build-tests
      - name: swift test
        run: swift test --skip ComponentSnapshotTests
      # A missing or changed component snapshot fails the job (in the last step, so the builds and DocC below still
      # run); its render goes up as an artifact to record from.
      - name: Component snapshots (references in Tests/OuroHXTests/__Snapshots__/macOS-<major>)
        id: snapshots
        continue-on-error: true
        run: OURO_SNAPSHOT_RECORD=never swift test --filter ComponentSnapshotTests
      - id: upload2
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-actual-macos-26
          path: Tests/OuroHXTests/__Snapshots__/**/*.actual.png
          if-no-files-found: ignore
      - if: always() && steps.upload2.outcome == 'failure'
        run: echo "::warning::The snapshots-actual-macos-26 artifact did not upload (see the step's log); the job's result stands without it."
      - name: The skills linter, as an agent runs it
        run: |
          set -u
          swift run ouro-ax-skills lint Tests/OuroAXSkillsLintTests/Fixtures/Good/Skills.skillsbundle --json
          swift run ouro-ax-skills lint Tests/OuroAXSkillsLintTests/Fixtures/Bad/Skills.skillsbundle --json && status=0 || status=$?
          test "$status" -eq 3
      - name: Ouro Reins, as an agent runs it (ls, do, a refusal, the exit codes)
        run: |
          set -u
          swift build --product ouro-reins-sample
          bin="$(swift build --show-bin-path)/ouro-reins-sample"
          "$bin" ls 'do openItem {"id":"flour"}' 'do toggleStocked' 'do goBack' > .build/reins-ok.ndjson
          printf 'ls\ndo nope\n{"id":3,"op":"do","action":"openItem","input":{"id":7}}\n' | "$bin" > .build/reins-refused.ndjson && status=0 || status=$?
          test "$status" -eq 2
          python3 -I - .build/reins-ok.ndjson .build/reins-refused.ndjson <<'PY'
          import json, sys
          ok = [json.loads(l) for l in open(sys.argv[1])]
          assert [r["ok"] for r in ok] == [True] * 4, ok
          assert [r["screen"]["focus"] for r in ok] == ["list", "item", "item", "list"], ok
          assert ok[2]["screen"]["state"]["stocked"] is False, ok[2]
          bad = [json.loads(l) for l in open(sys.argv[2])]
          assert bad[1]["error"]["code"] == "action-unavailable" and "openItem" in bad[1]["error"]["fix"], bad[1]
          assert bad[2]["id"] == 3 and bad[2]["error"]["code"] == "input-invalid", bad[2]
          print("reins: ls/do round trip and refusals as documented")
          PY
      - name: Ouro Reins' debug socket is compiled out of release
        run: sh scripts/check-reins-release.sh
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      - name: DocC
        run: sh scripts/docc.sh .build/docc
      - name: Build the gallery app
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroHXGallery && xcodegen generate)
          xcodebuild build -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/gallery CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      # DocC file names hold colons, which upload-artifact refuses, so the archives go up as one tarball.
      - name: Pack DocC
        run: tar -czf .build/docc.tgz -C .build docc
      - id: upload3
        # A copy of what the job built: a storage outage must not turn a passing job red (#35).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: docc
          path: .build/docc.tgz
      - if: steps.upload3.outcome == 'failure'
        run: echo "::warning::The docc artifact did not upload (see the step's log); the job's result stands without it."
      - name: Component snapshots matched
        if: steps.snapshots.outcome == 'failure'
        run: |
          echo "::error::A component snapshot is missing or changed. Record it from the snapshots-actual-macos-26 artifact into Tests/OuroHXTests/__Snapshots__/macOS-26."
          exit 1

  gallery-build:
    name: Gallery build for testing (free macos-26, Xcode 26)
    # Builds the gallery and its UI tests once; the four shards below test that build on their own simulators. Pull
    # requests run it only when they change what the gallery links (the `paths` job).
    needs: paths
    if: needs.paths.outputs.gallery == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: key
        name: The build's name, by commit, Xcode and run attempt
        run: |
          set -eu
          xcode="$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')"
          echo "artifact=gallery-tests-$GITHUB_SHA-xcode-$xcode-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build the gallery and its UI tests once
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroHXGallery && xcodegen generate)
          xcodebuild build-for-testing -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery \
            -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" \
            -derivedDataPath .build/gallery CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
          ls .build/gallery/Build/Products/*.xctestrun
          # Uncompressed: the upload compresses it, and a single-threaded gzip here would hold the shards up.
          tar -cf .build/gallery-products.tar -C .build/gallery/Build Products
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.artifact }}
          path: .build/gallery-products.tar
          retention-days: 2
          compression-level: 1
          if-no-files-found: error

  gallery-motion:
    name: Gallery hitch probe (main and releases, report only)
    # MotionTests in a Release build, as people run it: a Debug SwiftUI build hitches where the shipped one does not.
    # Reported, not gated, on this hosted VM: it has no GPU, and its frame timing swings run to run. On one commit
    # (a41b0ae vs 8c02d4e's identical components), sheet, toast and stack passed in one run and failed all three tries in
    # the next (#25). The 5 ms/s limit is unchanged and gates on a Mac's simulator and on device; a failure here leaves a
    # warning and the result bundle. Not on pull requests: its Release build cost each one 9 minutes. The Gallery UI
    # check does not wait for it.
    needs: paths
    if: github.event_name != 'pull_request' && needs.paths.outputs.gallery == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: A simulator, booting while the build runs
        run: python3 -I scripts/ci-simulator.py start ouro-hx-motion
      - name: Build the gallery for Release
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroHXGallery && xcodegen generate)
          xcodebuild build-for-testing -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery -configuration Release \
            -destination "id=$UDID" -derivedDataPath .build/gallery-release CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      - name: The simulator finished booting
        timeout-minutes: 16
        run: python3 -I scripts/ci-simulator.py wait ouro-hx-motion 240
      - name: Every transition is smooth (hitch probe, Release build)
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Examples/OuroHXGallery/OuroHXGallery.xcodeproj -scheme OuroHXGallery -configuration Release \
            -destination "id=$UDID" -derivedDataPath .build/gallery-release -resultBundlePath .build/gallery-motion.xcresult \
            -only-testing:OuroHXGalleryUITests/MotionTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error|failed|passed|skipped|Executed|TEST" | tail -60 \
            || { echo "::warning title=Motion over the limit on the hosted VM::See the MotionTests results above and gallery-motion.xcresult (#25)."; exit 1; }
      - if: always()
        name: Pack the result bundle
        run: test -d .build/gallery-motion.xcresult && tar -czf .build/gallery-motion.tgz -C .build gallery-motion.xcresult || true
      - id: upload4
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-motion-xcresult
          path: .build/gallery-motion.tgz
          if-no-files-found: ignore
      - if: always() && steps.upload4.outcome == 'failure'
        run: echo "::warning::The gallery-motion-xcresult artifact did not upload (see the step's log); the job's result stands without it."

  gallery-shard:
    name: Gallery UI shard ${{ matrix.shard }} of 4 (free macos-26, Xcode 26)
    # performAccessibilityAudit on every component page at the default and the largest text size, in light and dark,
    # plus 44-point targets, VoiceOver names, close controls and the waiting action toast, split four ways by measured
    # time (scripts/gallery-shards.py). Each shard starts with the build, boots its simulator while the build runs, then
    # tests the build's products. Pull requests run them only when they change what the gallery links.
    needs: paths
    if: needs.paths.outputs.gallery == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: A simulator for this shard, booting while the build runs
        run: |
          set -eu
          python3 -I scripts/ci-simulator.py --selftest
          python3 -I scripts/ci-simulator.py start ouro-hx-ui
      - id: key
        name: The build this shard tests, by commit and Xcode
        run: |
          set -eu
          xcode="$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//; s/^Xcode-//; s/-Build-version-/-/')"
          echo "prefix=gallery-tests-$GITHUB_SHA-xcode-$xcode-attempt-" >> "$GITHUB_OUTPUT"
      - id: artifact
        name: The build is ready
        # The shard starts with the build rather than after it, so its simulator boots while the build runs. It waits
        # here for this attempt's build. When "re-run failed jobs" did not rerun the build, it takes the newest earlier
        # attempt's build of the same commit and Xcode. It stops at once if the build job failed or was cancelled.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ steps.key.outputs.prefix }}
        run: |
          set -u
          names() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | .name' 2>/dev/null | grep -F "$PREFIX" || true
          }
          # `current`: this attempt's build. `any`: the newest attempt's build of this commit and Xcode.
          pick() {
            if [ "$1" = current ]; then names | grep -xF "$PREFIX$GITHUB_RUN_ATTEMPT" || true
            else names | sed "s/^.*-attempt-//" | sort -n | tail -1 | sed "s/^/$PREFIX/" | grep -F "$PREFIX" || true; fi
          }
          # "<attempt the build job ran in> <its conclusion>", or "0 " when this attempt lists no build job.
          build_state() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("Gallery build for testing"))][0] // {} | "\(.run_attempt // 0) \(.conclusion // "")"' \
              2>/dev/null || echo "0 "
          }
          while :; do
            name="$(pick current)"
            if [ -z "$name" ]; then
              # shellcheck disable=SC2046
              set -- $(build_state); built_in="${1:-0}"; conclusion="${2:-}"
              case "$conclusion" in failure|cancelled|skipped|timed_out) echo "::error::The build job ended $conclusion; nothing to test"; exit 1 ;; esac
              # Not built in this attempt (carried over by "re-run failed jobs"): the newest earlier build is the same build.
              if [ "$built_in" != "$GITHUB_RUN_ATTEMPT" ]; then name="$(pick any)"; fi
              if [ -z "$name" ] && [ "$conclusion" = success ]; then
                sleep 10; name="$(pick current)"
                test -n "$name" || { echo "::error::The build job succeeded without uploading $PREFIX$GITHUB_RUN_ATTEMPT: this shard's Xcode differs from the build's"; exit 1; }
              fi
            fi
            if [ -n "$name" ]; then echo "Testing $name"; echo "name=$name" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 15
          done
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .build
      - name: Unpack the build
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          mkdir -p .build/gallery/Build
          tar -xf .build/gallery-products.tar -C .build/gallery/Build
          set -- .build/gallery/Build/Products/*.xctestrun
          xctestrun="$1"; test -f "$xctestrun"
          echo "XCTESTRUN=$PWD/$xctestrun" >> "$GITHUB_ENV"
          # The audit's page filter goes into the test run's own environment, not through xcodebuild's TEST_RUNNER_.
          python3 -I scripts/gallery-shards.py env "$xctestrun" "$(python3 -I scripts/gallery-shards.py pages "$SHARD")"
      # Booted and settled before the tests start, as the X-ray probe does: a cold boot under the first test was where
      # the runner lost testmanagerd (main, run 42166414006). A boot that hangs or aborts gets one fresh device.
      - name: The simulator finished booting
        timeout-minutes: 16
        run: python3 -I scripts/ci-simulator.py wait ouro-hx-ui 240
      - name: Gallery UI tests, shard ${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -u
          mkdir -p .build
          only="$(python3 -I scripts/gallery-shards.py args "$SHARD")"
          pages="$(python3 -I scripts/gallery-shards.py pages "$SHARD")"
          echo "Shard $SHARD runs:"; echo "$only"; test -n "$pages" && echo "Audit pages: $pages"
          gallery() {
            # shellcheck disable=SC2086
            xcodebuild test-without-building -xctestrun "$XCTESTRUN" \
              -destination "id=$UDID" -resultBundlePath ".build/$1.xcresult" $only > ".build/$1.log" 2>&1
          }
          # A runner that loses testmanagerd, never bootstraps or can't find the simulator it just booted (#42) ran
          # nothing wrong in the app: that is the machine, so it gets one more run on a rebooted simulator, reported as an
          # infrastructure retry. So does a run whose only failures are screenshot requests the simulator never answered
          # (#43); a real assertion failure next to one still fails. Any other failure fails.
          infra() {
            { cat ".build/$1.log"; xcrun xcresulttool get test-results summary --path ".build/$1.xcresult" 2>/dev/null; } |
              grep -m1 -oE "Lost connection to testmanagerd|never finished bootstrapping|Test runner exited before starting test execution|Failed to establish communication with the test runner|Unable to find a device matching the provided destination specifier" && return 0
            failures="$(grep -c ': error: -\[' ".build/$1.log" || true)"
            timeouts="$(grep -c ': error: -\[.*Failed to get screenshot: Timed out while requesting screenshot' ".build/$1.log" || true)"
            if [ "$timeouts" -gt 0 ] && [ "$timeouts" -eq "$failures" ]; then echo "Timed out while requesting screenshot"; return 0; fi
            return 1
          }
          name="gallery-ui-$SHARD"
          status=0; gallery "$name" || status=$?
          grep -E "error|failed|passed|Executed|TEST" ".build/$name.log" | tail -80
          if [ "$status" -ne 0 ] && cause="$(infra "$name")"; then
            echo "::warning title=Infrastructure retry::Gallery UI shard $SHARD: \"$cause\". Rebooting the simulator and running it once more; the first attempt's log, and its result bundle where one was written, are kept as $name-attempt-1."
            # A runner that never bootstrapped may have left no bundle; one that did must move it, or xcodebuild
            # refuses to write the next.
            if [ -e ".build/$name.xcresult" ]; then mv ".build/$name.xcresult" ".build/$name-attempt-1.xcresult"; fi
            mv ".build/$name.log" ".build/$name-attempt-1.log"
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b >/dev/null
            status=0; gallery "$name" || status=$?
            grep -E "error|failed|passed|Executed|TEST" ".build/$name.log" | tail -80
          fi
          if [ "$status" -eq 0 ]; then
            # A shard that ran nothing, or an audit that ran no page, would pass on nothing: what ran must be the plan.
            python3 -I scripts/gallery-shards.py ran "$SHARD" ".build/$name.xcresult" || status=1
          fi
          exit "$status"
      - if: always()
        name: Pack the result bundle
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          bundles="$(cd .build && ls -d gallery-ui-"$SHARD"*.xcresult gallery-ui-"$SHARD"*.log 2>/dev/null || true)"
          test -n "$bundles" && tar -czf ".build/gallery-ui-$SHARD.tgz" -C .build $bundles || true
      - id: upload4
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-ui-xcresult-${{ matrix.shard }}
          path: .build/gallery-ui-${{ matrix.shard }}.tgz
          if-no-files-found: ignore
      - if: always() && steps.upload4.outcome == 'failure'
        run: echo "::warning::The gallery-ui-xcresult-${{ matrix.shard }} artifact did not upload (see the step's log); the job's result stands without it."

  gallery-ui:
    name: Gallery UI tests, the component claims (free macos-26, Xcode 26)
    # The required check. It passes only when the build and every shard passed, or when the change does not touch the
    # gallery. It runs even when they fail or the run is cancelled (`always()`), so a red or cancelled shard can never
    # leave this check skipped, which GitHub counts as a pass.
    needs: [paths, gallery-build, gallery-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          PATHS: ${{ needs.paths.result }}
          GALLERY: ${{ needs.paths.outputs.gallery }}
          BUILD: ${{ needs.gallery-build.result }}
          SHARDS: ${{ needs.gallery-shard.result }}
        run: |
          set -eu
          echo "paths=$PATHS gallery=$GALLERY build=$BUILD shards=$SHARDS"
          if [ "$PATHS" != success ]; then echo "::error::The paths job ended $PATHS"; exit 1; fi
          if [ "$GALLERY" = false ]; then echo "This change doesn't touch what the gallery links."; exit 0; fi
          if [ "$BUILD" = success ] && [ "$SHARDS" = success ]; then echo "The build and all four shards passed."; exit 0; fi
          echo "::error::Build $BUILD, shards $SHARDS"; exit 1

  xray:
    name: X-ray the fixture app (${{ matrix.name }})
    # The behaviour stage needs an Xcode whose AppIntentsTesting matches the OS it runs on: Xcode 27.2's needs a 27.2
    # OS, and this image has macOS 27.0.1 with iOS 27.0 and 27.1 simulators. So each lane pins an older Xcode to a
    # matching OS. See docs/decisions/2026-11-03-ax-xray.md.
    needs: paths
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.paths.outputs.xray == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "iOS 27.1 simulator, Xcode 27.1", xcode: "27.1", platform: ios, runtime: "27.1", device: "iPhone Duo", destination: "generic/platform=iOS Simulator", expect: full }
          - { name: "iOS 27.0 simulator, Xcode 27.0", xcode: "27.0", platform: ios, runtime: "27.0", device: "iPhone 17 Pro", destination: "generic/platform=iOS Simulator", expect: full }
          - { name: "macOS 27.0.1, Xcode 27.1", xcode: "27.1", platform: macos, runtime: "", device: "", destination: "platform=macOS", expect: refused }
          # macOS: AppIntentsTesting refuses a probe that is not signed by the app's team (AppIntentsServicesSecurityErrorDomain
          # 800). CI signs ad hoc, so this lane proves the refusal is reported as a skip with the fix, not as the app failing.
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode ${{ matrix.xcode }} for this job only
        run: |
          set -eu
          for app in /Applications/Xcode_*.app; do
            v="$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || true)"
            if [ "$v" = "${{ matrix.xcode }}" ] || [ "$v" = "${{ matrix.xcode }}.0" ]; then echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"; echo "Using $app ($v)"; exit 0; fi
          done
          ls -d /Applications/Xcode_*.app; exit 1
      - name: Tools
        run: |
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          swift build -c release --product ouro-ax-xray
      - name: Build the fixture app with the same Xcode
        run: |
          set -o pipefail
          (cd Examples/OuroAXXrayFixture && xcodegen generate)
          xcodebuild build -project Examples/OuroAXXrayFixture/OuroAXXrayFixture.xcodeproj -scheme OuroAXXrayFixture \
            -destination '${{ matrix.destination }}' -derivedDataPath .build/fixture CODE_SIGN_IDENTITY=- 2>&1 | tail -20
          find .build/fixture/Build/Products -maxdepth 2 -name XrayFixture.app
      - name: X-ray it, metadata and behaviour
        # A passing probe takes 9 to 21 minutes. Its own limit, inside the job's, fails a hang here with the log kept
        # and the report still uploaded; at the job's limit GitHub cancels the job and keeps no log (#46).
        timeout-minutes: 30
        run: |
          set -eu
          app="$(find .build/fixture/Build/Products -maxdepth 2 -name XrayFixture.app | head -1)"
          sh scripts/xray-probe.sh --app "$app" --out .build/xray --platform ${{ matrix.platform }} \
            --runtime "${{ matrix.runtime }}" --device-type "${{ matrix.device }}" --commit "$GITHUB_SHA" --disposable
      - name: The probe saw the fixture's notes and its refusals
        run: |
          python3 -I - .build/xray/report.json ${{ matrix.expect }} <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          if sys.argv[2] == "refused":
              n = {(x["claim"], x["surface"]): (x["verdict"], x["note"]) for x in r["results"]}
              for k in [("entity.ids-resolve", "entity NoteEntity"), ("entity.indexed", "entity NoteEntity")]:
                  print(k, n[k])
                  assert n[k][0] == "skip" and n[k][1].startswith("AppIntentsTesting refused the probe"), k
              sys.exit(0)
          v = {(x["claim"], x["surface"]): x["verdict"] for x in r["results"]}
          print(json.dumps({k[0] + " " + k[1]: x for k, x in v.items() if k[0] in ("entity.ids-resolve", "entity.indexed", "entity.transfer-round-trip", "annotation.onscreen", "intent.error-names-fix")}, indent=1))
          assert v[("entity.ids-resolve", "entity NoteEntity")] == "pass", "ids-resolve"
          n = {(x["claim"], x["surface"]): x["note"] for x in r["results"]}
          assert v[("entity.indexed", "entity NoteEntity")] == "pass", "indexed"
          assert v[("entity.transfer-round-trip", "entity NoteEntity")] == "pass", "round trip"
          refusal = n[("intent.error-names-fix", "intent OpenNoteIntent")]
          assert not refusal.startswith("the probe could not reach"), "the refusals reached the app: " + refusal
          PY
      - id: upload5
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-fixture-${{ matrix.platform }}-${{ matrix.xcode }}
          path: .build/xray
      - if: always() && steps.upload5.outcome == 'failure'
        run: echo "::warning::The xray-fixture-${{ matrix.platform }}-${{ matrix.xcode }} artifact did not upload (see the step's log); the job's result stands, and the X-ray report is in the log above."

  siri-ai-sdk:
    name: Siri AI parts (Xcode 27.3 beta, compile only)
    # The tool-intent and SiriEvaluations code compiles only against the 27.3 beta SDK. When the image carries an
    # Xcode 27.3 or later, this lane builds with OURO_SIRI_AI_SDK set; until then it says so and passes.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Find Xcode 27.3 or later
        id: find
        run: |
          set -eu
          if sh scripts/select-xcode.sh 27.3; then echo "found=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::No Xcode 27.3 or later on the xcode-27 image yet; the Siri AI parts were not compiled here."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build with the Siri AI parts on
        if: steps.find.outputs.found == 'true'
        run: |
          swift build --build-tests -Xswiftc -DOURO_SIRI_AI_SDK
          set -o pipefail
          xcodebuild build -scheme OuroUIApple-Package -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode-beta CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -DOURO_SIRI_AI_SDK' 2>&1 | tail -40

  feel-fixture:
    name: Ouro Feel catches every genre's bug (free macos-26, Xcode 26)
    # Examples/OuroFeelFixture has one page per genre of jank with a known bug behind `-bug 1`; FeelCatchesTests proves
    # each check fails on the bug and passes without it. Reports go up as an artifact. Pull requests run it only when
    # they change Ouro Feel, the fixture or what they share (the `paths` job); main and releases always do.
    needs: paths
    if: needs.paths.outputs.feel == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: A fresh simulator for this job, booting while the build runs
        run: |
          set -eu
          python3 -I scripts/ci-simulator.py start ouro-feel-ci
      - name: Build the fixture and its UI tests once
        run: |
          set -o pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd Examples/OuroFeelFixture && xcodegen generate)
          xcodebuild build-for-testing -project Examples/OuroFeelFixture/OuroFeelFixture.xcodeproj -scheme OuroFeelFixture \
            -destination "id=$UDID" -derivedDataPath .build/feel-fixture CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
      # Booted and settled before the tests: left to xcodebuild, the first test's setUp can reach a simulator whose
      # accessibility is not up yet ("Failed to get list of active applications", kAXError -25218).
      - name: The simulator finished booting
        id: booted
        timeout-minutes: 16
        run: python3 -I scripts/ci-simulator.py wait ouro-feel-ci 240
      - name: Fixture UI tests (a fresh simulator; only the first test starts cold, so reports say "not labelled")
        run: |
          set -o pipefail
          TEST_RUNNER_OURO_FEEL_REPORT_DIR="$PWD/.build/feel-reports" \
          xcodebuild test-without-building -project Examples/OuroFeelFixture/OuroFeelFixture.xcodeproj -scheme OuroFeelFixture \
            -destination "id=$UDID" -derivedDataPath .build/feel-fixture -resultBundlePath .build/feel-fixture.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "\[ouro-feel\]|error|failed|passed|Executed|TEST" | tail -200
      - if: always()
        name: Pack the reports and result bundle
        run: |
          mkdir -p .build/feel-reports
          test -d .build/feel-fixture.xcresult && tar -czf .build/feel-reports/feel-fixture-xcresult.tgz -C .build feel-fixture.xcresult || true
      - id: upload6
        # A diagnostic copy of a result already decided above: a storage outage must not turn the job red (#35).
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ouro-feel-fixture-reports
          path: .build/feel-reports
          if-no-files-found: ignore
      - if: always() && steps.upload6.outcome == 'failure'
        run: echo "::warning::The ouro-feel-fixture-reports artifact did not upload (see the step's log); the job's result stands without it."
