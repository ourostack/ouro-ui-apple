name: Rerun a run a broken runner stopped

# When a CI or accessibility pass run's first attempt failed only because a runner's simulator service was broken (#74: no app code ran),
# rerun its failed jobs once on fresh runners, rather than waiting for a person. Any other failure is left as it is.
# It reads job annotations and logs and calls the rerun API only; it checks out nothing from the run it reruns.
on:
  workflow_run:
    workflows: [CI, Accessibility pass]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    name: Rerun failed jobs a broken runner stopped (#74)
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -I scripts/ci-rerun-broken-runner.py --selftest
          python3 -I scripts/ci-rerun-broken-runner.py "${{ github.event.workflow_run.id }}"
