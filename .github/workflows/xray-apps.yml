name: X-ray our apps

# Runs ouro-ax-xray, metadata and behaviour, against our public apps at their default branch, and uploads the reports.
# It checks them out read-only and opens nothing against them. It needs the billed xcode-27 runner, so it runs only
# when a release is published, or by hand (see ci.yml's note on where checks run). Each app is one call of xray-app.yml,
# the same workflow an app's own CI calls.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xray:
    name: X-ray ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Spoonjoy
            app-repo: spoonjoy/spoonjoy-apple
            platform: ios
            build: >-
              xcodebuild -project Spoonjoy.xcodeproj -scheme "Spoonjoy iOS" -configuration BootstrapDebug
              -destination "generic/platform=iOS Simulator" -derivedDataPath "$PWD/.xray-derived" CODE_SIGNING_ALLOWED=NO build
            product: .xray-derived/Build/Products/BootstrapDebug-iphonesimulator/Spoonjoy.app
            # BootstrapDebug talks to production unless SPOONJOY_API_BASE_URL is set, so no refusal runs or read-backs.
            disposable: false
          - name: Ouro MD
            app-repo: ourostack/ouro-md
            platform: macos
            build: OURO_MD_TELEMETRY_DISABLED=1 ./make-app.sh
            product: OuroMD.app
            # Re-signed with the Apple Development certificate for the probe, so the behaviour claims run.
            disposable: true
          - name: Gatefold
            app-repo: ourostack/gatefold
            platform: metadata
            build: >-
              xcodebuild -downloadComponent MetalToolchain && xcodegen generate &&
              xcodebuild -project Gatefold.xcodeproj -scheme Gatefold -configuration Debug -destination "generic/platform=iOS Simulator"
              -derivedDataPath "$PWD/.xray-derived" CODE_SIGNING_ALLOWED=NO build
            product: .xray-derived/Build/Products/Debug-iphonesimulator/Gatefold.app
            disposable: false
    uses: ./.github/workflows/xray-app.yml
    with:
      name: ${{ matrix.name }}
      platform: ${{ matrix.platform }}
      build: ${{ matrix.build }}
      product: ${{ matrix.product }}
      disposable: ${{ matrix.disposable }}
      app-repo: ${{ matrix.app-repo }}
      tooling-ref: ${{ github.sha }}
    secrets:
      apple-development-certificate-base64: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
      apple-development-certificate-password: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
