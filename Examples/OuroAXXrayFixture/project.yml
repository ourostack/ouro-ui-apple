# A small app with App Intents that holds some Ouro AX claims and breaks others on purpose, so the X-ray has a known
# subject. CI builds it, installs it on a simulator and X-rays it. Generate with `xcodegen generate`.
name: OuroAXXrayFixture
options:
  bundleIdPrefix: bot.ouro.ax
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
targets:
  OuroAXXrayFixture:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: bot.ouro.ax.xray-fixture
        PRODUCT_NAME: XrayFixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Xray Fixture
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
